<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveSuite Player</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { display: grid; place-items: center; }
    #grid { display: grid; width: 100vw; height: 100vh; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4px; background: #000; }
    canvas { display: block; width: 100%; height: 100%; background: #000; }
    #audio-unlock { position: fixed; right: 12px; bottom: 12px; z-index: 10; border: 0; border-radius: 999px; padding: 8px 14px; font: 14px sans-serif; color: #fff; background: rgba(24, 24, 24, .8); cursor: pointer; }
  </style>
</head>
<body>
  <div id="grid"></div>
  <button id="audio-unlock" type="button" hidden>开启声音</button>
  <script>
  (() => {
    'use strict';

    // ============ 共享服务端时钟 ============
    // 时钟同步由服务端与拉流网页共同完成：服务端把每条流的采集时刻预测到
    // 服务端墙钟（FLV 时间戳已落在服务端时钟轴上），并给出保证各流平滑
    // 播放的对齐延迟；网页定期拉取同步信息，把服务端时钟换算回本机时钟
    // 后统一调度所有流的播放时刻。
    const SYNC_URL = '/livesuite/sync-info';
    const PLAYBACK_FEEDBACK_URL = '/livesuite/playback-feedback';
    const PLAYER_BUILD_ID = 'av-gapless-v21';
    const SYNC_POLL_MS = 1000;
    const SYNC_STARTUP_WAIT_MS = 1500;
    const PLAYBACK_FEEDBACK_POLL_MS = 250;
    const SYNC_REQUEST_TIMEOUT_MS = 2500;
    const PLAYBACK_FEEDBACK_TIMEOUT_MS = 1000;
    const TARGET_LATENCY_MS = 180;
    // 压缩视频只保留到“即将解码”的窗口之外，因此队列上限随配置的显示
    // 延迟增长；这里是无额外延迟时的基础上限。
    const MAX_VIDEO_INPUT = 90;
    const MAX_VIDEO_INPUT_BYTES = 1536 * 1024;
    const MAX_VIDEO_INPUT_BYTES_HARD = 256 * 1024 * 1024;
    const VIDEO_INPUT_BYTES_PER_SECOND = 8 * 1024 * 1024;
    const MAX_VIDEO_AHEAD_US = 750000;
    // 解码只提前到显示时刻前的一小段：latent 很大时压缩帧留在输入队列，
    // 已解码帧始终只覆盖一个短窗口，既省显存也避免旧算法把远期帧裁掉。
    const VIDEO_DECODE_AHEAD_US = 300000;
    const MAX_VIDEO_OUTPUT = 128;
    const MAX_VIDEO_OUTPUT_AHEAD_US = 500000;
    const INITIAL_TARGET_VIDEO_FPS = 60;
    const MIN_TARGET_VIDEO_FPS = 12;
    const MAX_TARGET_VIDEO_FPS = 240;
    // 半秒窗口用于检测持续的本地性能压力；真正降档前还要连续命中多个
    // 窗口，避免一次 GC 或窗口合成抖动改变长期展示节拍。
    const FRAME_RATE_SAMPLE_INTERVAL_MS = 500;
    const REQUIRED_PRESENTATION_RATIO = 0.95;
    // 源端可能在静止画面主动切成可变帧率。只要当前窗口的源供给明显低于
    // canvas 目标，就禁止用“实际呈现数不足”推断本地性能，且允许 rAF 继续
    // 恢复本地目标。源速率永远不再成为播放器的持久帧率上限。
    const SOURCE_SUPPLY_REQUIRED_RATIO = 0.98;
    const SOURCE_SUPPLY_TOLERANCE_FPS = 1.5;
    // rAF 是显示器刷新驱动的。把 95% 的“展示成功率”直接乘到 rAF 上会让
    // 60Hz 显示器永远把 60fps 限制到 57fps，因此只留很小的测量容差。
    const FRAME_RATE_RAF_TOLERANCE_FPS = 1.5;
    const FRAME_RATE_EPSILON_FPS = 0.25;
    const FRAME_RATE_LIMITED_SAMPLES_BEFORE_DECREASE = 2;
    const FRAME_RATE_HEALTHY_SAMPLES_BEFORE_INCREASE = 2;
    // 控制目标是连续值，不再使用 60/30/20 等固定档位。下降速度跟随实际
    // 达标率，恢复速度跟随已证明的余量；单次调整限幅仅用于避免控制振荡。
    const FRAME_RATE_CAPACITY_DECREASE_ALPHA = 0.5;
    const FRAME_RATE_CAPACITY_RECOVERY_ALPHA = 0.08;
    const FRAME_RATE_SOURCE_RECOVERY_ALPHA = 0.5;
    const FRAME_RATE_MAX_DECREASE_FRACTION = 0.15;
    const FRAME_RATE_MAX_INCREASE_FRACTION = 0.20;
    const FRAME_RATE_MIN_ADJUSTMENT_FPS = 0.5;
    const VIDEO_PRESENTATION_EPSILON_MS = 0.25;
    // 源帧间隔恰为整数个 rAF 节拍（30fps@60Hz、60fps@60Hz、30fps@30Hz…）
    // 时，把每帧的理想显示时刻推到两个 vsync 的正中间。落在节拍边界附近的
    // 帧会被时钟抖动随机推早/推晚，形成 1-3-1-3 的抖动；居中后同样的抖动
    // 完全不会改变呈现节拍。相位搬移量最多半个节拍，且只在边界区才进行。
    const PRESENTATION_PHASE_CADENCE_TOLERANCE = 0.05;
    const PRESENTATION_PHASE_MIN_SAMPLES = 4;
    const PRESENTATION_PHASE_MIN_RESULTANT = 0.6;
    const PRESENTATION_PHASE_EDGE_FRACTION = 0.2;
    const PRESENTATION_PHASE_MAX_SLEW_MS_PER_FRAME = 0.5;
    // 节拍锁定需连续多个窗口成立，避免源帧率估计的瞬时噪声触发相位搬移。
    const PRESENTATION_CADENCE_LOCK_SAMPLES = 2;
    // 音频以“画面实际呈现的时刻”为同步基准：每张呈现帧相对理想时刻的滞后
    // 经平滑后并入音频目标；数据晚到时声音跟随画面，而不是空转追赶时间轴。
    const DISPLAY_LAG_ALPHA = 0.1;
    const RAF_INTERVAL_SAMPLE_LIMIT = 64;
    // 压缩音频按显示时刻按需解码；audiolatent 最多 60 秒，96 kHz 每秒约
    // 94 个 AAC 块，因此上限要能容纳合法的 60 秒延迟而不是把它当作故障。
    const MAX_AUDIO_INPUT = 8192;
    const AUDIO_DECODE_AHEAD_MS = 350;
    // 迟到超过该值的压缩音频不再解码：它对应的画面早已过去，播放只会让
    // 音画错位更久。更短的迟到量会照常播出并由本地控速平滑追回。
    const MAX_AUDIO_LATE_SCHEDULE_SECONDS = 0.25;
    // 重新起播（解锁声音、建立时间轴、重同步）时只清除已经错过播放点的
    // 压缩块。尚未到播放时刻的块必须完整保留：共享对齐延迟可能由实测自动
    // 增长到数百毫秒，若每次到包都只留“最新一小段”，播放点会永远追不上。
    // AudioWorklet 建好后若迟迟没有状态回报，或抛出 processorerror，改用
    // ScriptProcessorNode 承载同一个 FIFO；页面参数 audioout=script 可强制。
    const AUDIO_FALLBACK_STATUS_TIMEOUT_MS = 2500;
    const AUDIO_OUTPUT_CLOCK_WARMUP_MS = 250;
    const AUDIO_SCRIPT_PROCESSOR_BUFFER_FRAMES = 1024;
    // 有音频配置、上下文运行中却持续没有声音输出时，定期在控制台打印诊断。
    const AUDIO_SILENCE_REPORT_INTERVAL_MS = 5000;
    // 迟到不超过此值的 PCM 直接交给本地控速平滑追回；超过此值的孤立块
    // 直接丢弃，只有迟到状态跨过按实际音频组时长建立的窗口才移动时间轴。
    const MAX_AUDIO_LATE_CATCH_UP_MS = 2000;
    // FIFO 空时把下一块排到它应当出声的时刻：主线程消息到达 worklet 需要
    // 一两个渲染量子，因此实际起点至少留出这段提前量。
    const AUDIO_FIFO_PRIME_LEAD_SECONDS = 0.008;
    const AUDIO_FIFO_PRIME_TOLERANCE_SECONDS = 0.002;
    const AUDIO_CONTIGUITY_TOLERANCE_US = 3000;
    const AUDIO_TIMESTAMP_PENDING_LIMIT = 8;
    const AUDIO_SOURCE_GAP_FADE_MS = 3;
    // 源音频本身的空洞用静音补齐以保持时间轴；过大的空洞按重新起播处理。
    const MAX_AUDIO_HOLE_US = 500000;
    const AUDIO_RECOVERY_STATUS_INTERVAL_MS = 1000;
    // 解码输出看门狗按 AAC 帧时长动态放宽；48/96 kHz 下约 120ms，低采样率
    // 最多 600ms。检测同时要求输入仍活跃且声卡前缓冲即将耗尽。
    const MIN_AUDIO_DECODER_STALL_MS = 120;
    const MAX_AUDIO_DECODER_STALL_MS = 600;
    const AUDIO_INPUT_ACTIVE_WINDOW_MS = 1000;
    const AUDIO_DECODER_RECOVERY_COOLDOWN_MS = 250;
    const AUDIO_CONTEXT_RESUME_RETRY_MS = 1000;
    const AUDIO_CONTEXT_RESUME_SLOW_RETRY_MS = 5000;
    const AUDIO_CONTEXT_RESUME_FAST_ATTEMPTS = 10;
    // PCM 域连续 WSOLA 时间伸缩：控速不经过重采样，因此不会变调。颗粒以
    // 毫秒定义并按采样率换算；重叠区做相似度搜索，等功率交叠避免拼接痕迹。
    const AUDIO_STRETCH_SEQUENCE_MS = 32;
    const AUDIO_STRETCH_OVERLAP_MS = 8;
    const AUDIO_STRETCH_SEEK_MS = 10;
    const AUDIO_STRETCH_MIN_RATE = 0.9;
    const AUDIO_STRETCH_MAX_RATE = 1.1;
    const AUDIO_STRETCH_INPUT_CAPACITY_FRAMES = 1 << 17;
    // 本地音画同步：音频以自身声卡时钟连续播放，用极小的伸缩比把已听到
    // 的媒体位置锁在视频时间轴上。死区内完全透传；偏差越大纠正越快，但
    // 单次更新只允许缓慢改变速率，且总量限制在听不出变速的范围内。
    const AUDIO_SYNC_DEADBAND_MS = 6;
    const AUDIO_SYNC_TIME_CONSTANT_MS = 5000;
    const AUDIO_SYNC_MAX_DEVIATION = 0.005;
    const AUDIO_SYNC_MAX_DEVIATION_PER_SECOND = 0.002;
    const AUDIO_SYNC_FILTER_MS = 250;
    const AUDIO_SYNC_STATUS_HISTORY_LIMIT = 128;
    const AUDIO_SYNC_TOTAL_MAX_DEVIATION = 0.01;
    const AUDIO_SYNC_HARD_RESYNC_MS = 400;
    // FIFO 储备低于此值时不允许为追赶而加速：加速只会把仅剩的数据更快耗尽。
    const AUDIO_SYNC_MIN_RESERVE_MS = 40;
    // 自适应播放延迟：压缩音频到达时相对播放时刻的提前量若不足以覆盖
    // “解码延迟 + 伸缩前瞻 + 入队提前量 + 安全余量”，声音必然迟到甚至断续
    //（主线程拥堵时 AudioDecoder 的回调可能晚数百毫秒）。此时把本地播放
    // 时间轴整体后移（视频同步后移，音画保持一致），并像页面 latent 一样
    // 在反馈里补回，服务端不会把它当作漂移去纠正；余量长期充裕时再缓慢收回。
    // 与页面 latent 一样允许较大的异常恢复范围；正常值只有几十毫秒，60 秒
    // 上限只防止错误时间戳把页面无限冻结，并与压缩队列的合法跨度一致。
    const ADAPTIVE_LATENT_MAX_MS = 60_000;
    const ADAPTIVE_LATENT_SAFETY_MS = 30;
    const ADAPTIVE_LATENT_SURPLUS_MS = 80;
    const ADAPTIVE_LATENT_DECAY_HOLD_MS = 30000;
    const ADAPTIVE_LATENT_DECAY_MS_PER_SECOND = 5;
    const AUDIO_DECODE_LATENCY_ALPHA = 0.2;
    const AUDIO_DECODE_LATENCY_PEAK_DECAY = 0.98;
    const DEGRADED_VIDEO_RECOVERY_SAMPLES = 40;
    const FLV_TIMESTAMP_MODULUS_MS = 0x100000000;

    // 服务端时钟估算：offset = serverEpochMs - performance.now()。多次取样
    // 后取最小 RTT 的样本，降低网络抖动对时钟换算的影响。
    let serverOffsetMs = null;
    let alignmentDelayMs = TARGET_LATENCY_MS;
    let sourceAlignmentDelayMs = TARGET_LATENCY_MS;
    let sharedPlaybackClock = null;
    // 服务端为延迟处于 P95 的帧预留的拉流端处理余量，以及各轨的到达延迟
    // 统计；只用于诊断，预留本身由服务端的对齐延迟完成。
    let serverPullLeadMs = null;
    const serverLatencyByPath = new Map();
    let synchronizeEnabled = false;
    let syncInfoReady = false;
    let syncRequestInFlight = false;
    let resolveSyncInfoReady = null;
    const syncInfoReadyPromise = new Promise((resolve) => { resolveSyncInfoReady = resolve; });
    const originByPath = new Map();
    const playerSessions = [];
    const playbackClientId = (() => {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return 'livesuite-' + Math.random().toString(36).slice(2) + '-' + Date.now().toString(36);
    })();
    let syncSamples = [];
    const pageParams = new URLSearchParams(location.search);
    const ownPath = decodeStreamPath(location.pathname);
    const parsedLatentMs = Number(pageParams.get('latent'));
    // latent 只影响网页端的显示调度,不参与服务端拉流或时钟预测。
    const EXTRA_LATENT_MS = Number.isFinite(parsedLatentMs)
      ? Math.min(60_000, Math.max(0, parsedLatentMs))
      : 0;
    const forcedAudioOutput = pageParams.get('audioout');
    const parsedAudioLatentMs = Number(pageParams.get('audiolatent'));
    // audiolatent 只把浏览器端的音频调度向后移动,不改变视频时间轴或
    // 服务端对齐决策,适合音游等需要自行拉开音视频延迟的场景。
    const EXTRA_AUDIO_LATENT_MS = Number.isFinite(parsedAudioLatentMs)
      ? Math.min(60_000, Math.max(0, parsedAudioLatentMs))
      : 0;

    function playbackLatencyMs() {
      let delayMs = synchronizeEnabled && Number.isFinite(sharedPlaybackClock?.alignmentDelayMs)
        ? sharedPlaybackClock.alignmentDelayMs : alignmentDelayMs;
      if (synchronizeEnabled && sharedPlaybackClock) {
        const nowServerMs = serverOffsetMs === null ? sharedPlaybackClock.anchorServerMs
          : performance.now() + serverOffsetMs;
        const positionUs = sharedPlaybackClock.anchorPositionUs
          + (nowServerMs - sharedPlaybackClock.anchorServerMs) * sharedPlaybackClock.playbackRate * 1000;
        // 目标预算回落时公共时钟仍连续追赶。队列和音频健康阈值必须覆盖
        // 实际延迟，否则合法的未来帧会被丢弃，FIFO 的等待会被反复清空。
        delayMs = Math.max(delayMs, nowServerMs - positionUs / 1000);
      }
      return Math.max(0, delayMs) + EXTRA_LATENT_MS;
    }

    function applySharedPlaybackClock(clock) {
      if (!synchronizeEnabled || !clock || !Number.isFinite(clock.revision)
        || typeof clock.id !== 'string'
        || !Number.isFinite(clock.anchorServerMs) || !Number.isFinite(clock.anchorPositionUs)
        || !Number.isFinite(clock.playbackRate) || clock.playbackRate < 0.9 || clock.playbackRate > 1.1) return;
      if (sharedPlaybackClock && clock.id === sharedPlaybackClock.id
        && clock.revision <= sharedPlaybackClock.revision) return;
      const previous = sharedPlaybackClock;
      const inferredDelayUs = previous && previous.id === clock.id
        ? previous.anchorPositionUs
          + (clock.anchorServerMs - previous.anchorServerMs) * previous.playbackRate * 1000
          - clock.anchorPositionUs
        : 0;
      // 漏收中间几次控速响应也会产生很小的锚点差，不能把它当作插静音
      // 指令。只执行服务端明确累计的重新蓄水；旧服务端仅兼容大幅重锚。
      const delayedUs = previous && previous.id === clock.id
        && Number.isFinite(clock.rebufferedUs) && Number.isFinite(previous.rebufferedUs)
        ? Math.max(0, clock.rebufferedUs - previous.rebufferedUs)
        : inferredDelayUs >= 100000 ? inferredDelayUs : 0;
      const startupRecovered = previous && previous.id === clock.id
        && Number.isFinite(clock.startupRecoveryRevision)
        && clock.startupRecoveryRevision > (previous.startupRecoveryRevision || 0);
      const stalledRecovered = previous && previous.id === clock.id
        && Number.isFinite(clock.stalledRecoveryRevision)
        && clock.stalledRecoveryRevision > (previous.stalledRecoveryRevision || 0);
      sharedPlaybackClock = clock;
      for (const session of playerSessions) {
        session.setPlaybackRate(clock.playbackRate);
        if (startupRecovered || stalledRecovered) {
          session.resetAlignmentEvidence(true);
          session.displayLagMs = 0;
          session.nextVideoPresentationMs = null;
          session.closeAudioDecoderInstance(false);
          session.resetAudioTimeline(stalledRecovered ? 'shared-stall-recovery' : 'shared-startup-recovery');
          session.configureAudio();
        } else if (delayedUs > 500) {
          session.resetAlignmentEvidence();
          session.delayAudioOutput(delayedUs / (clock.playbackRate * 1000));
        }
      }
    }

    function applyPlaybackRate(rate, streamPath = null) {
      if (!Number.isFinite(rate)) return;
      const bounded = Math.min(1.1, Math.max(0.9, rate));
      for (const session of playerSessions) {
        if (streamPath === null || session.streamPath === streamPath) {
          session.setPlaybackRate(bounded);
        }
      }
    }

    // Keep every short polling request bounded. A hung response would otherwise
    // occupy one of the browser's per-host connections forever; repeated polls
    // can then queue for hours and retain their request/response closures.
    async function fetchJsonWithTimeout(url, init, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...init, signal: controller.signal });
        if (!response.ok) return null;
        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    }

    function refreshSyncInfo() {
      if (syncRequestInFlight) return;
      const t0 = performance.now();
      const syncQuery = '?t0=' + encodeURIComponent(t0)
        + '&clientId=' + encodeURIComponent(playbackClientId)
        + '&streamPath=' + encodeURIComponent(ownPath);
      syncRequestInFlight = true;
      fetchJsonWithTimeout(SYNC_URL + syncQuery, {
        cache: 'no-store',
      }, SYNC_REQUEST_TIMEOUT_MS)
        .then((info) => {
          if (!info) return;
          const t1 = performance.now();
          const previousSynchronize = synchronizeEnabled;
          const previousAlignmentDelayMs = alignmentDelayMs;
          syncInfoReady = true;
          synchronizeEnabled = Boolean(info.synchronize);
          if (previousSynchronize !== synchronizeEnabled) sharedPlaybackClock = null;
          applySharedPlaybackClock(info.sharedPlaybackClock);
          if (Number.isFinite(info.alignmentDelayMs) && info.alignmentDelayMs >= 0) {
            alignmentDelayMs = info.alignmentDelayMs;
          }
          sourceAlignmentDelayMs = Number.isFinite(info.sourceAlignmentDelayMs)
            ? info.sourceAlignmentDelayMs : alignmentDelayMs;
          serverPullLeadMs = Number.isFinite(info.pullLeadMs) ? info.pullLeadMs : null;
          // 同步页面只接受服务端公共时钟；非同步页面继续由反馈响应控制
          // 本地速率。共享时钟的 revision 防止较慢的轮询覆盖更新的反馈。
          if (Array.isArray(info.streams)) {
            originByPath.clear();
            for (const entry of info.streams) {
              if (typeof entry.path === 'string' && Number.isFinite(entry.originServerMs) && entry.originServerMs > 0) {
                originByPath.set(entry.path, entry.originServerMs);
              }
              if (typeof entry.path === 'string') {
                serverLatencyByPath.set(entry.path, {
                  videoLatencyP95Ms: Number.isFinite(entry.videoLatencyP95Ms) ? entry.videoLatencyP95Ms : null,
                  audioLatencyP95Ms: Number.isFinite(entry.audioLatencyP95Ms) ? entry.audioLatencyP95Ms : null,
                  videoArrivalCadenceP95Ms: Number.isFinite(entry.videoArrivalCadenceP95Ms)
                    ? entry.videoArrivalCadenceP95Ms : null,
                  audioArrivalCadenceP95Ms: Number.isFinite(entry.audioArrivalCadenceP95Ms)
                    ? entry.audioArrivalCadenceP95Ms : null,
                  audioGroupDurationMs: Number.isFinite(entry.audioGroupDurationMs) ? entry.audioGroupDurationMs : null,
                });
              }
            }
          }
          const serverReceiveMs = Number.isFinite(info.serverReceiveEpochMs)
            ? info.serverReceiveEpochMs : info.serverEpochMs;
          const serverSendMs = Number.isFinite(info.serverSendEpochMs)
            ? info.serverSendEpochMs : serverReceiveMs;
          if (Number.isFinite(serverReceiveMs) && Number.isFinite(serverSendMs)) {
            // HTTP 四时间点协商:服务端返回处理前后的 t1/t2,网页用 t0/t3
            // 的中点估计服务端墙钟,避免把单向网络延迟当成时钟偏移。
            syncSamples.push({
              offset: (serverReceiveMs + serverSendMs) / 2 - (t0 + t1) / 2,
              rtt: t1 - t0,
            });
            if (syncSamples.length > 8) syncSamples.shift();
            let best = null;
            for (const sample of syncSamples) {
              if (!best || sample.rtt < best.rtt) best = sample;
            }
            if (best) serverOffsetMs = best.offset;
          }
          if (resolveSyncInfoReady) {
            resolveSyncInfoReady();
            resolveSyncInfoReady = null;
          }
          const alignmentDeltaMs = alignmentDelayMs - previousAlignmentDelayMs;
          if (Math.abs(alignmentDeltaMs) >= 0.5) {
            // 播放器为迟到音频临时增加的本地延迟，可在服务端共享延迟增长后
            // 转交给服务端，避免两层余量叠加。已出画面的剩余差值继续由原有
            // 闭环小幅控速吸收，不突然停画；尚未出画面则可直接修正起播点。
            for (const session of playerSessions) {
              session.applyServerAlignmentDelay(alignmentDeltaMs);
            }
          }
          if (previousSynchronize !== synchronizeEnabled) {
            for (const session of playerSessions) session.resetForRealignment();
          }
        })
        .catch(() => {})
        .finally(() => {
          syncRequestInFlight = false;
        });
    }
    refreshSyncInfo();
    setInterval(refreshSyncInfo, SYNC_POLL_MS);

    function setStatus(value, isError) {
      if (isError) console.warn('[LiveSuite]', value);
    }

    function u24(data, offset) {
      return (data[offset] << 16) | (data[offset + 1] << 8) | data[offset + 2];
    }

    function u32(data, offset) {
      return (data[offset] * 0x1000000) + (data[offset + 1] << 16) +
        (data[offset + 2] << 8) + data[offset + 3];
    }

    function unwrapFlvTimestampMs(rawTimestampMs, previousTimestampMs, expectedTimestampMs) {
      const reference = Number.isFinite(expectedTimestampMs)
        ? expectedTimestampMs
        : previousTimestampMs;
      if (!Number.isFinite(reference)) return rawTimestampMs;
      const wrapCount = Math.max(0, Math.round(
        (reference - rawTimestampMs) / FLV_TIMESTAMP_MODULUS_MS,
      ));
      return rawTimestampMs + wrapCount * FLV_TIMESTAMP_MODULUS_MS;
    }

    function signed24(data, offset) {
      const value = u24(data, offset);
      return (value & 0x800000) ? value - 0x1000000 : value;
    }

    function appendBytes(left, right) {
      const result = new Uint8Array(left.length + right.length);
      result.set(left);
      result.set(right, left.length);
      return result;
    }

    function avccDescriptionKey(data) {
      return Array.from(data).join(',');
    }

    function makeAvcCodec(data) {
      if (data.length < 4) throw new Error('AVC 配置过短');
      return 'avc1.' + [data[1], data[2], data[3]]
        .map((value) => value.toString(16).padStart(2, '0')).join('');
    }

    function parseAudioConfig(data, stereoHint) {
      if (data.length < 2) throw new Error('AAC 配置过短');
      let objectType = data[0] >> 3;
      let frequencyIndex = ((data[0] & 7) << 1) | (data[1] >> 7);
      let bitOffset = 13;
      if (objectType === 31) {
        if (data.length < 3) throw new Error('AAC 扩展配置过短');
        objectType = 32 + ((data[1] & 0x7f) << 3) | (data[2] >> 5);
        bitOffset = 18;
      }
      const sampleRates = [96000, 88200, 64000, 48000, 44100, 32000, 24000,
        22050, 16000, 12000, 11025, 8000, 7350];
      let sampleRate;
      if (frequencyIndex === 15) {
        const byteOffset = Math.floor(bitOffset / 8);
        if (data.length < byteOffset + 3) throw new Error('AAC 采样率配置过短');
        sampleRate = (data[byteOffset] << 16) | (data[byteOffset + 1] << 8) | data[byteOffset + 2];
      } else {
        sampleRate = sampleRates[frequencyIndex];
      }
      const channelConfig = (data[1] >> 3) & 0x0f;
      const channels = [0, 1, 2, 3, 4, 5, 6, 0][channelConfig] || (stereoHint ? 2 : 1);
      if (!sampleRate || !channels) throw new Error('AAC 音频布局不受支持');
      return {
        data: data.slice(),
        codec: 'mp4a.40.' + objectType,
        sampleRate,
        channels,
        key: avccDescriptionKey(data) + ':' + channels
      };
    }

    function clampNumber(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function decodeStreamPath(value) {
      try { return decodeURIComponent(value); } catch (_) { return value; }
    }

    // ============ 音频 PCM 处理 ============
    // 采样率兜底转换：AudioContext 按 AAC 采样率创建，正常情况下不需要它；
    // 只有浏览器拒绝该采样率时才把 PCM 线性插值到上下文采样率。
    class LinearResampler {
      constructor(channels, inputRate, outputRate) {
        this.channels = channels;
        this.inputRate = inputRate;
        this.outputRate = outputRate;
        this.step = inputRate / outputRate;
        this.history = null;
        this.phase = 0;
      }

      process(planes) {
        if (!planes.length || !planes[0].length) return planes;
        const inputFrames = planes[0].length;
        const historyFrames = this.history ? 1 : 0;
        const extendedFrames = inputFrames + historyFrames;
        const outputFrames = Math.max(0, Math.floor((extendedFrames - 1 - this.phase) / this.step) + 1);
        const output = [];
        const startPhase = this.phase;
        let nextPhase = startPhase;
        for (let channel = 0; channel < planes.length; channel++) {
          const source = planes[channel];
          const previous = this.history ? this.history[channel] : 0;
          const destination = new Float32Array(outputFrames);
          let position = startPhase;
          for (let index = 0; index < outputFrames; index++) {
            const base = Math.floor(position);
            const fraction = position - base;
            const left = base === 0 && historyFrames ? previous : source[base - historyFrames];
            const rightIndex = base + 1 - historyFrames;
            const right = rightIndex < inputFrames ? source[rightIndex] : source[inputFrames - 1];
            destination[index] = left * (1 - fraction) + right * fraction;
            position += this.step;
          }
          output.push(destination);
          nextPhase = position - (extendedFrames - 1);
        }
        // 所有声道必须从同一分数采样位置开始；相位属于帧时间轴，只能在整
        // 个多声道块处理完后推进一次，否则右声道会比左声道多走一个块。
        this.phase = nextPhase;
        this.history = planes.map((plane) => plane[inputFrames - 1]);
        return output;
      }
    }

    // 连续 WSOLA 时间伸缩。输入按绝对采样序号写入环形缓冲，输出按颗粒
    // 序列生成：每个颗粒复制一段原始波形，颗粒之间用短交叠区拼接；下一个
    // 颗粒的起点在“理想位置 ± 搜索窗”内选择与上一颗粒自然延续最相似的
    // 波形，于是速率变化只改变颗粒间的取样位置而不改变波形本身的音高。
    // 速率恰为 1 时颗粒起点就是自然延续，输出与输入逐样本相同。
    class AudioTimeStretcher {
      constructor(channels, sampleRate, options = {}) {
        this.channels = Math.max(1, channels | 0);
        this.sampleRate = sampleRate;
        const framesFor = (ms) => Math.max(8, Math.round(ms * sampleRate / 1000));
        this.overlap = framesFor(options.overlapMs ?? AUDIO_STRETCH_OVERLAP_MS);
        this.hop = Math.max(
          this.overlap,
          framesFor(options.sequenceMs ?? AUDIO_STRETCH_SEQUENCE_MS) - this.overlap,
        );
        this.seek = framesFor(options.seekMs ?? AUDIO_STRETCH_SEEK_MS);
        this.capacity = options.capacityFrames ?? AUDIO_STRETCH_INPUT_CAPACITY_FRAMES;
        this.mask = this.capacity - 1;
        this.input = [];
        for (let channel = 0; channel < this.channels; channel++) {
          this.input.push(new Float32Array(this.capacity));
        }
        this.mono = new Float32Array(this.capacity);
        this.fadeIn = new Float32Array(this.overlap);
        this.fadeOut = new Float32Array(this.overlap);
        for (let index = 0; index < this.overlap; index++) {
          const weight = 0.5 - 0.5 * Math.cos(Math.PI * (index + 0.5) / this.overlap);
          this.fadeIn[index] = weight;
          this.fadeOut[index] = 1 - weight;
        }
        this.outputCapacity = options.outputCapacityFrames ?? 16384;
        this.output = [];
        for (let channel = 0; channel < this.channels; channel++) {
          this.output.push(new Float32Array(this.outputCapacity));
        }
        this.stats = { grains: 0, searches: 0, transparentGrains: 0, maxSearchDeviation: 0 };
        this.reset();
      }

      reset() {
        this.inputWritten = 0;
        this.gapFadeInRemaining = 0;
        this.inputKeepFrom = 0;
        this.outputWritten = 0;
        this.outputFill = 0;
        this.rate = 1;
        this.idealInputStart = 0;
        this.grainInputStart = null;
        this.grainOutputStart = 0;
        this.grainProduced = 0;
        this.previousInputStart = null;
        this.segments = [];
      }

      setRate(rate) {
        this.rate = clampNumber(
          Number.isFinite(rate) ? rate : 1,
          AUDIO_STRETCH_MIN_RATE,
          AUDIO_STRETCH_MAX_RATE,
        );
      }

      // 尚未生成输出的输入帧数（不含仍留作交叠参考的旧样本）。
      bufferedInputFrames() {
        const consumed = this.grainInputStart === null
          ? this.inputKeepFrom
          : this.grainInputStart + this.grainProduced;
        return Math.max(0, this.inputWritten - consumed);
      }

      canAccept(frames) {
        return this.inputWritten + frames - this.inputKeepFrom <= this.capacity;
      }

      pushInput(planes) {
        const frames = planes[0]?.length || 0;
        if (!frames) return true;
        if (!this.canAccept(frames)) return false;
        const base = this.inputWritten;
        const mask = this.mask;
        const inverseChannels = 1 / this.channels;
        const fadeFrames = Math.max(1, Math.round(AUDIO_SOURCE_GAP_FADE_MS * this.sampleRate / 1000));
        const fadeRemaining = this.gapFadeInRemaining;
        for (let channel = 0; channel < this.channels; channel++) {
          const source = planes[Math.min(channel, planes.length - 1)];
          const ring = this.input[channel];
          for (let index = 0; index < frames; index++) {
            const gain = index < fadeRemaining
              ? 0.5 - 0.5 * Math.cos(Math.PI * (fadeFrames - fadeRemaining + index + 1) / fadeFrames) : 1;
            ring[(base + index) & mask] = source[index] * gain;
          }
        }
        for (let index = 0; index < frames; index++) {
          let sum = 0;
          for (let channel = 0; channel < this.channels; channel++) {
            sum += this.input[channel][(base + index) & mask];
          }
          this.mono[(base + index) & mask] = sum * inverseChannels;
        }
        this.inputWritten += frames;
        this.gapFadeInRemaining = Math.max(0, fadeRemaining - frames);
        return true;
      }

      pushSilence(frames) {
        if (frames <= 0) return true;
        if (!this.canAccept(frames)) return false;
        const base = this.inputWritten;
        const mask = this.mask;
        const fadeFrames = Math.max(1, Math.round(AUDIO_SOURCE_GAP_FADE_MS * this.sampleRate / 1000));
        const tails = this.input.map((ring) => base > 0 ? ring[(base - 1) & mask] : 0);
        for (let index = 0; index < frames; index++) {
          const slot = (base + index) & mask;
          const gain = index < fadeFrames ? 0.5 + 0.5 * Math.cos(Math.PI * (index + 1) / fadeFrames) : 0;
          let sum = 0;
          for (let channel = 0; channel < this.channels; channel++) {
            const sample = tails[channel] * gain;
            this.input[channel][slot] = sample;
            sum += sample;
          }
          this.mono[slot] = sum / this.channels;
        }
        this.inputWritten += frames;
        this.gapFadeInRemaining = fadeFrames;
        return true;
      }

      searchGrainStart(natural, target, low, high) {
        const mono = this.mono;
        const mask = this.mask;
        const overlap = this.overlap;
        let referenceEnergy = 0;
        for (let index = 0; index < overlap; index += 2) {
          const reference = mono[(natural + index) & mask];
          referenceEnergy += reference * reference;
        }
        if (referenceEnergy < 1e-9) return target;
        // 相同相似度时优先靠近理想位置：周期信号会以整数周期为单位跟随
        // 请求速率，噪声则由最大相关决定。
        const penalty = 1e-4 / Math.max(1, this.seek);
        let best = target;
        let bestScore = -Infinity;
        // 粗搜索的步进与自然延续点同奇偶，保证自然延续点本身一定被评估。
        const firstCandidate = low + ((natural - low) & 1);
        for (let candidate = firstCandidate; candidate <= high; candidate += 2) {
          let dot = 0;
          let energy = 0;
          for (let index = 0; index < overlap; index += 2) {
            const reference = mono[(natural + index) & mask];
            const sample = mono[(candidate + index) & mask];
            dot += reference * sample;
            energy += sample * sample;
          }
          const score = dot / Math.sqrt(referenceEnergy * energy + 1e-12)
            - penalty * Math.abs(candidate - target);
          if (score > bestScore) {
            bestScore = score;
            best = candidate;
          }
        }
        let fullReferenceEnergy = 0;
        for (let index = 0; index < overlap; index++) {
          const reference = mono[(natural + index) & mask];
          fullReferenceEnergy += reference * reference;
        }
        let refined = best;
        let refinedScore = -Infinity;
        for (let candidate = Math.max(low, best - 3); candidate <= Math.min(high, best + 3); candidate++) {
          let dot = 0;
          let energy = 0;
          for (let index = 0; index < overlap; index++) {
            const reference = mono[(natural + index) & mask];
            const sample = mono[(candidate + index) & mask];
            dot += reference * sample;
            energy += sample * sample;
          }
          const score = dot / Math.sqrt(fullReferenceEnergy * energy + 1e-12)
            - penalty * Math.abs(candidate - target);
          if (score > refinedScore) {
            refinedScore = score;
            refined = candidate;
          }
        }
        return refined;
      }

      startGrain() {
        const available = this.inputWritten;
        if (this.grainInputStart === null) {
          if (available <= this.inputKeepFrom) return false;
          this.grainInputStart = this.inputKeepFrom;
          this.idealInputStart = this.grainInputStart;
          this.grainOutputStart = this.outputWritten;
          this.grainProduced = 0;
          this.previousInputStart = null;
          this.segments.push({
            outputStart: this.outputWritten,
            inputStart: this.grainInputStart,
            idealStart: this.idealInputStart,
            rate: this.rate,
          });
          this.stats.grains++;
          return true;
        }
        const previous = this.grainInputStart;
        const natural = previous + this.hop;
        // 理想输入位置按绝对时间以 hop×rate 推进，与上一颗粒实际选中的位置
        // 无关；搜索偏差因此始终有界（≤ seek），长期消耗速率严格等于请求
        // 速率。若把理想位置建立在实际位置之上，窗口内总能找到相关度为 1 的
        // 自然延续点，控速会退化为不变速。
        const ideal = this.idealInputStart + this.hop * this.rate;
        const target = Math.round(ideal);
        let start;
        if (this.rate === 1 && target === natural) {
          if (available < natural + 1) return false;
          start = natural;
          this.stats.transparentGrains++;
        } else {
          if (available < target + this.seek + this.overlap) return false;
          const low = Math.max(this.inputKeepFrom, target - this.seek, 0);
          const high = Math.min(target + this.seek, available - this.overlap);
          start = low <= high ? this.searchGrainStart(natural, target, low, high) : natural;
          this.stats.searches++;
          const deviation = Math.abs(start - target);
          if (deviation > this.stats.maxSearchDeviation) this.stats.maxSearchDeviation = deviation;
        }
        // 速率恰为 1 时把理想位置对齐到实际位置：之后的颗粒直接透传，残余
        // 的固定偏移交给闭环同步控制吸收。
        this.idealInputStart = this.rate === 1 ? start : ideal;
        this.previousInputStart = previous;
        this.grainInputStart = start;
        this.grainOutputStart = this.outputWritten;
        this.grainProduced = 0;
        this.inputKeepFrom = Math.max(this.inputKeepFrom, Math.min(start, natural));
        this.segments.push({
          outputStart: this.outputWritten,
          inputStart: start,
          idealStart: this.idealInputStart,
          rate: this.rate,
        });
        if (this.segments.length > 512) this.segments.splice(0, this.segments.length - 384);
        this.stats.grains++;
        return true;
      }

      // 生成当前可生成的输出；返回本次新产生的各声道 PCM（可能为空）。
      process() {
        const mask = this.mask;
        const overlap = this.overlap;
        const hop = this.hop;
        while (this.outputFill < this.outputCapacity) {
          if (this.grainInputStart === null || this.grainProduced >= hop) {
            if (!this.startGrain()) break;
          }
          const available = this.inputWritten;
          const start = this.grainInputStart;
          const previous = this.previousInputStart;
          const transparent = previous === null || start === previous + hop;
          let produced = this.grainProduced;
          let limit;
          if (produced < overlap && !transparent) {
            limit = Math.min(overlap, available - start, available - previous - hop);
          } else {
            limit = Math.min(hop, available - start);
          }
          limit = Math.min(limit, produced + (this.outputCapacity - this.outputFill));
          if (limit <= produced) break;
          const fadeIn = this.fadeIn;
          const fadeOut = this.fadeOut;
          const fill = this.outputFill;
          for (let channel = 0; channel < this.channels; channel++) {
            const ring = this.input[channel];
            const destination = this.output[channel];
            let cursor = fill;
            for (let index = produced; index < limit; index++) {
              let sample = ring[(start + index) & mask];
              if (index < overlap && !transparent) {
                const tail = ring[(previous + hop + index) & mask];
                sample = tail * fadeOut[index] + sample * fadeIn[index];
              }
              destination[cursor++] = sample;
            }
          }
          const count = limit - produced;
          this.outputFill += count;
          this.outputWritten += count;
          this.grainProduced = limit;
        }
        return this.takeOutput();
      }

      takeOutput() {
        const frames = this.outputFill;
        if (!frames) return null;
        const planes = this.output.map((plane) => plane.slice(0, frames));
        this.outputFill = 0;
        return planes;
      }

      // 输出采样序号对应的输入采样序号（供音画同步把“已听到的输出”换算成
      // 媒体时间）。按颗粒起点的理想（受控）位置线性推算：相邻颗粒的理想
      // 位置严格首尾相接，因此映射单调平滑；实际选中位置最多偏离一个搜索
      // 窗口，不必把这份 WSOLA 抖动带进同步控制。
      inputPositionForOutput(outputIndex) {
        const segments = this.segments;
        if (!segments.length || !Number.isFinite(outputIndex)) return null;
        let low = 0;
        let high = segments.length - 1;
        while (low < high) {
          const middle = (low + high + 1) >> 1;
          if (segments[middle].outputStart <= outputIndex) low = middle;
          else high = middle - 1;
        }
        const segment = segments[low];
        if (outputIndex < segment.outputStart) return segment.idealStart;
        return Math.min(
          this.inputWritten,
          segment.idealStart + (outputIndex - segment.outputStart) * segment.rate,
        );
      }
    }

    // AudioWorklet FIFO：主线程只负责按顺序推入 PCM 块，渲染线程逐样本
    // 连续播放。块与块之间没有任何调度边界，也不存在节点各自重采样带来的
    // 拼接误差；缺数据时输出短暂衰减到静音，数据恢复时做几毫秒淡入。
    const AUDIO_WORKLET_PROCESSOR_NAME = 'livesuite-audio-fifo';
    const AUDIO_WORKLET_SOURCE = `
      class LiveSuiteAudioFifo extends AudioWorkletProcessor {
        constructor() {
          super();
          this.chunks = [];
          this.queuedFrames = 0;
          this.consumedFrames = 0;
          this.renderedFrames = 0;
          this.underrunFrames = 0;
          this.underruns = 0;
          this.flushes = 0;
          this.holdFrames = 0;
          this.holdFramesRequested = 0;
          this.starving = true;
          // 上一次输出的是静音（起播前、填充块、欠载或 flush 之后）：下一段
          // 数据做短淡入；数据进入静音时从最后一个采样指数衰减，不出现硬切。
          this.silent = true;
          this.fadeInRemaining = 0;
          this.fadeInLength = 128;
          this.tail = null;
          this.ticks = 0;
          this.statusInterval = 8;
          this.port.onmessage = (event) => this.handleMessage(event.data);
        }

        handleMessage(message) {
          if (!message) return;
          if (message.type === 'push') {
            const frames = message.frames | 0;
            if (frames <= 0) return;
            this.chunks.push({ planes: message.planes || null, frames, offset: 0 });
            this.queuedFrames += frames;
          } else if (message.type === 'hold') {
            const frames = message.frames | 0;
            if (frames > 0) {
              this.holdFrames += frames;
              this.holdFramesRequested += frames;
            }
          } else if (message.type === 'flush') {
            this.chunks = [];
            this.queuedFrames = 0;
            this.consumedFrames = 0;
            this.flushes++;
            this.holdFrames = 0;
            this.holdFramesRequested = 0;
            this.silent = true;
          } else if (message.type === 'configure') {
            if (Number.isFinite(message.statusInterval) && message.statusInterval > 0) {
              this.statusInterval = message.statusInterval | 0;
            }
          }
        }

        // 从最后一个已输出采样指数衰减到静音，约 1.5ms 内完成。
        writeDecay(output, from, count) {
          for (let channel = 0; channel < output.length; channel++) {
            const destination = output[channel];
            let value = this.tail[channel];
            for (let index = 0; index < count; index++) {
              value *= 0.9;
              destination[from + index] = value;
            }
            this.tail[channel] = value;
          }
        }

        process(inputs, outputs) {
          const output = outputs[0];
          if (!output || !output.length) return true;
          const channels = output.length;
          const frames = output[0].length;
          const contextTime = this.hostTime !== undefined ? this.hostTime : currentTime;
          const consumedBefore = this.consumedFrames;
          const queuedBefore = this.queuedFrames;
          const underrunBefore = this.underrunFrames;
          const holdBefore = this.holdFrames;
          if (!this.tail || this.tail.length !== channels) this.tail = new Float32Array(channels);
          let written = 0;
          if (this.holdFrames > 0) {
            written = Math.min(frames, this.holdFrames);
            this.writeDecay(output, 0, written);
            this.holdFrames -= written;
            this.silent = true;
          }
          while (written < frames && this.chunks.length) {
            const chunk = this.chunks[0];
            const count = Math.min(frames - written, chunk.frames - chunk.offset);
            if (chunk.planes) {
              if (this.silent) {
                this.silent = false;
                this.fadeInRemaining = this.fadeInLength;
              }
              for (let channel = 0; channel < channels; channel++) {
                const destination = output[channel];
                const source = chunk.planes[Math.min(channel, chunk.planes.length - 1)];
                for (let index = 0; index < count; index++) {
                  destination[written + index] = source[chunk.offset + index];
                }
              }
              if (this.fadeInRemaining > 0) {
                for (let index = 0; index < count && this.fadeInRemaining > 0; index++) {
                  const gain = 1 - this.fadeInRemaining / this.fadeInLength;
                  for (let channel = 0; channel < channels; channel++) {
                    output[channel][written + index] *= gain;
                  }
                  this.fadeInRemaining--;
                }
              }
              for (let channel = 0; channel < channels; channel++) {
                this.tail[channel] = output[channel][written + count - 1];
              }
            } else {
              this.writeDecay(output, written, count);
              this.silent = true;
            }
            chunk.offset += count;
            written += count;
            this.consumedFrames += count;
            this.queuedFrames -= count;
            if (chunk.offset >= chunk.frames) this.chunks.shift();
          }
          this.starving = written < frames;
          if (written < frames) {
            if (!this.silent) this.underruns++;
            this.silent = true;
            this.writeDecay(output, written, frames - written);
            this.underrunFrames += frames - written;
          }
          this.renderedFrames += frames;
          if (++this.ticks % this.statusInterval === 0) {
            this.port.postMessage({
              type: 'status',
              contextTime,
              consumedFrames: consumedBefore,
              queuedFrames: queuedBefore,
              underrunFrames: underrunBefore,
              underruns: this.underruns,
              flushes: this.flushes,
              holdFrames: holdBefore,
              holdFramesRequested: this.holdFramesRequested,
              renderedFrames: this.renderedFrames - frames,
              starving: this.starving,
            });
          }

        }
      }
      registerProcessor('${AUDIO_WORKLET_PROCESSOR_NAME}', LiveSuiteAudioFifo);
    `;

    // 在主线程上实例化同一个 FIFO 类（ScriptProcessorNode 回退）。基类与
    // registerProcessor 用垫片代替，process() 的时间由宿主提供。
    let mainThreadAudioFifoClass = null;
    function createMainThreadAudioFifo(statusHandler) {
      if (!mainThreadAudioFifoClass) {
        class AudioWorkletProcessorShim {
          constructor() {
            this.port = { onmessage: null, postMessage: () => {} };
          }
        }
        new Function('AudioWorkletProcessor', 'registerProcessor', AUDIO_WORKLET_SOURCE)(
          AudioWorkletProcessorShim,
          (_name, processorClass) => { mainThreadAudioFifoClass = processorClass; },
        );
      }
      const fifo = new mainThreadAudioFifoClass();
      fifo.port.postMessage = (message) => statusHandler(message);
      return fifo;
    }

    // 本地音画同步控制：误差为“正在听到的媒体时间 - 视频时间轴应当播放的
    // 媒体时间”。音频超前则略慢，落后则略快；死区内速率精确为 1。
    function audioSyncDeviationStep({ errorMs, deviation, allowFaster = true, elapsedMs = 20 }) {
      const current = Number.isFinite(deviation) ? deviation : 0;
      if (!Number.isFinite(errorMs)) return current;
      const magnitude = Math.max(0, Math.abs(errorMs) - AUDIO_SYNC_DEADBAND_MS);
      const desired = clampNumber(
        -Math.sign(errorMs) * magnitude / AUDIO_SYNC_TIME_CONSTANT_MS,
        -AUDIO_SYNC_MAX_DEVIATION,
        allowFaster === false ? 0 : AUDIO_SYNC_MAX_DEVIATION,
      );
      const maximumStep = AUDIO_SYNC_MAX_DEVIATION_PER_SECOND * clampNumber(elapsedMs, 0, 250) / 1000;
      return current + clampNumber(
        desired - current,
        -maximumStep,
        maximumStep,
      );
    }

    // 新 PCM 块入队策略：FIFO 非空且 PCM 流连续时永远首尾相接（时间轴由
    // 控速维持）；FIFO 空或流不连续（源空洞、迟到恢复后重新起播）时把块放
    // 到它应当出声的时刻，中间用静音填充；迟到不多时交给控速追回，严重迟
    // 到先返回 skip，由调用方结合真实到达时间窗口区分孤立抖动与持续偏移。
    function audioEnqueuePlan({ fifoEmpty, discontinuity, desiredContextTime, queueEndContextTime }) {
      if (!fifoEmpty && discontinuity !== true) {
        return { action: 'append', padSeconds: 0, lateSeconds: 0 };
      }
      if (!Number.isFinite(desiredContextTime) || !Number.isFinite(queueEndContextTime)) {
        return { action: 'append', padSeconds: 0, lateSeconds: 0 };
      }
      const gap = desiredContextTime - queueEndContextTime;
      if (gap > AUDIO_FIFO_PRIME_TOLERANCE_SECONDS) {
        return { action: 'pad', padSeconds: gap, lateSeconds: 0 };
      }
      const lateSeconds = Math.max(0, -gap);
      if (lateSeconds * 1000 <= MAX_AUDIO_LATE_CATCH_UP_MS) {
        return { action: 'append', padSeconds: 0, lateSeconds };
      }
      return { action: 'skip', padSeconds: 0, lateSeconds };
    }

    // 严重迟到恢复按经过的真实时间窗口判断，而不是按包数判断。窗口起点只
    // 在音频成功入队或时间线重置后清除，因此同一时刻批量到达的陈旧包不会
    // 误触发重建；持续迟到跨过完整窗口后才允许移动音视频时间轴。
    function audioLateWindowStep({ nowMs, startedAtMs, windowMs }) {
      const now = Number.isFinite(nowMs) ? nowMs : 0;
      const duration = Number.isFinite(windowMs) ? Math.max(0, windowMs) : 0;
      const started = Number.isFinite(startedAtMs) && startedAtMs <= now
        ? startedAtMs
        : now;
      return {
        startedAtMs: started,
        sustained: now - started >= duration,
      };
    }

    // AAC 标签按发送端一次 PCM 采集所覆盖的媒体时长归组。一组可能被编码器
    // 拆成多个标签，也可能在一个网络批次中一起到达；只有下一组出现时才把
    // 上一组的最小到达提前量提交为一项时间证据。
    function audioArrivalGroupStep({
      anchorUs,
      groupIndex,
      minLeadMs,
      minLeadObservedAtMs,
      timestampUs,
      leadMs,
      observedAtMs,
      groupDurationMs,
    }) {
      const durationUs = Number.isFinite(groupDurationMs)
        ? Math.max(0, groupDurationMs) * 1000
        : 0;
      if (!(durationUs > 0) || !Number.isFinite(timestampUs)) {
        return {
          anchorUs: timestampUs,
          groupIndex: 0,
          minLeadMs: leadMs,
          minLeadObservedAtMs: observedAtMs,
          completed: { leadMs, observedAtMs },
        };
      }
      if (!Number.isFinite(anchorUs) || !Number.isFinite(groupIndex)
        || timestampUs < anchorUs) {
        return {
          anchorUs: timestampUs,
          groupIndex: 0,
          minLeadMs: leadMs,
          minLeadObservedAtMs: observedAtMs,
          completed: null,
        };
      }
      const nextIndex = Math.floor((timestampUs - anchorUs) / durationUs);
      if (nextIndex !== groupIndex) {
        const completed = Number.isFinite(minLeadMs) && Number.isFinite(minLeadObservedAtMs)
          ? { leadMs: minLeadMs, observedAtMs: minLeadObservedAtMs }
          : null;
        return {
          anchorUs,
          groupIndex: nextIndex,
          minLeadMs: leadMs,
          minLeadObservedAtMs: observedAtMs,
          completed,
        };
      }
      const replaceMinimum = !Number.isFinite(minLeadMs) || leadMs < minLeadMs;
      return {
        anchorUs,
        groupIndex,
        minLeadMs: replaceMinimum ? leadMs : minLeadMs,
        minLeadObservedAtMs: replaceMinimum ? observedAtMs : minLeadObservedAtMs,
        completed: null,
      };
    }

    // 由 worklet 最近一次状态推算“此刻正在渲染的输出采样序号”。
    function audioRenderedOutputFrame({ status, appendedFrames, contextTimeNow, sampleRate }) {
      if (!status || !Number.isFinite(status.contextTime) || !Number.isFinite(status.consumedFrames)) {
        return null;
      }
      if (contextTimeNow < status.contextTime) return null;
      const elapsedFrames = Math.max(0,
        Math.max(0, contextTimeNow - status.contextTime) * sampleRate - (status.holdFrames || 0),

      return Math.min(appendedFrames, status.consumedFrames + elapsedFrames);

    // 输出设备时钟通常落后渲染线程几十毫秒；必须从出声时刻之前的状态外推，
    // 不能把“未来量子”的 consumedFrames 当作已经听到的声音。
    function audioStatusForContextTime(history, contextTime) {
      for (let index = history.length - 1; index >= 0; index--) {
        if (history[index].contextTime <= contextTime) return history[index];
      }
      return null;
    }

    // 将页面的 performance 时钟换算成“真正送到声卡”的 AudioContext 时钟。
    // getOutputTimestamp 能同时消除 AudioContext 启动偏移与设备输出延迟；旧版
    // Chromium 则使用 outputLatency/baseLatency 作保守回退。
    function audioOutputLatencySeconds(audioContext) {
      return Number.isFinite(audioContext.outputLatency)
        ? Math.max(0, audioContext.outputLatency)
        : Number.isFinite(audioContext.baseLatency) ? Math.max(0, audioContext.baseLatency) : 0;
    }

    function audioOutputStamp(audioContext) {
      if (audioContext.state === 'running'
        && typeof audioContext.getOutputTimestamp === 'function') {
        const stamp = audioContext.getOutputTimestamp();
        if (Number.isFinite(stamp?.contextTime) && Number.isFinite(stamp?.performanceTime)
          && stamp.contextTime > 0 && stamp.performanceTime > 0) {

        }

      return null;

    function audioContextTimeForPerformance(audioContext, targetPerfMs) {
      const stamp = audioOutputStamp(audioContext);
      if (stamp) {
        return stamp.contextTime + (targetPerfMs - stamp.performanceTime) / 1000;
      }
      return audioContext.currentTime
        + (targetPerfMs - performance.now()) / 1000
        - audioOutputLatencySeconds(audioContext);
    }

    function audioDecoderRecoveryReason({
      decoderReady,
      clockReady,
      inputAgeMs,
      outputAgeMs,
      bufferedSeconds,
      graceRemainingMs,
      recoveryAgeMs,
      stallThresholdMs,
      inputActiveWindowMs,
      recoveryBufferSeconds,
      pendingAgeMs = outputAgeMs,
    }) {
      if (!decoderReady || !clockReady) return null;
      if (![inputAgeMs, outputAgeMs, bufferedSeconds, graceRemainingMs,
        recoveryAgeMs, stallThresholdMs, inputActiveWindowMs,
        recoveryBufferSeconds, pendingAgeMs].every(Number.isFinite)) {
        return null;
      }
      if (inputAgeMs > inputActiveWindowMs || graceRemainingMs > 0) return null;
      if (recoveryAgeMs < AUDIO_DECODER_RECOVERY_COOLDOWN_MS) return null;
      if (outputAgeMs < stallThresholdMs || bufferedSeconds > recoveryBufferSeconds) return null;
      // 网络停顿后刚恢复的一串输入还没来得及解码：只有“最早一次尚未得到
      // 输出的提交”也已超过停滞阈值，才认定解码器停滞。
      if (pendingAgeMs < stallThresholdMs) return null;
      // decodeQueueSize 可能已经回到 0：Chromium 有时会消费 EncodedAudioChunk

    // 视频时间轴都可用时才开始解码。否则把压缩 AAC 暂存在 audioInput，等待
    // 音频输出就绪或关键帧建立时钟后再解码，避免“解出来马上丢掉”造成无声。
    // 重新起播时跳过明显陈旧的积压，从最新一段开始；不按迟到与否丢弃。
    function retainFreshAudioInput(audioInput, currentTargetUs, sourceCadenceMs = 0) {
      if (!Number.isFinite(currentTargetUs) || !audioInput.length) return audioInput;
      const cadenceMs = Number.isFinite(sourceCadenceMs) ? Math.max(0, sourceCadenceMs) : 0;
      const earliestUs = currentTargetUs - cadenceMs * 1000;

      while (first < audioInput.length && audioInput[first].timestampUs < earliestUs) first++;

    function retainSchedulableAudioInput(
      audioInput,
      currentTargetUs,
      maxLateSeconds = MAX_AUDIO_LATE_SCHEDULE_SECONDS,
    ) {
      if (!Number.isFinite(currentTargetUs) || !audioInput.length) return audioInput;
      const earliestUs = currentTargetUs - maxLateSeconds * 1000000;
      let first = 0;
      while (first < audioInput.length && audioInput[first].timestampUs < earliestUs) first++;
      return first === 0 ? audioInput : audioInput.slice(first);
    }

    // ============ 视频呈现控制 ============
    function advanceVideoPresentationDeadline(deadlineMs, nowMs, targetFps) {
      const intervalMs = 1000 / Math.max(1, targetFps);
      if (!Number.isFinite(deadlineMs)) return nowMs + intervalMs;

        1,
        Math.floor(
          (nowMs + VIDEO_PRESENTATION_EPSILON_MS - deadlineMs) / intervalMs,
        ) + 1,
      );

    // 以真实达标率连续估算本地呈现容量。源供给不足时 presentationRatio
    // 没有本地性能含义，因此只使用 rAF/长帧信号，并用健康 rAF 快速恢复
    // 容量估计。目标变化仍由绝对截止时间均匀摊开，不会集中丢一段画面。
    function evaluateFrameRateControl({
      targetVideoFps,
      preferredVideoFps,
      rafFps,
      presentationRatio,
      longRafRatio,
      sourceLimited,
      measurementSuspended,
      capacityEstimateFps,
      stableSamples,
      limitedSamples,
    }) {
      const target = clampNumber(
        Number.isFinite(targetVideoFps) ? targetVideoFps : INITIAL_TARGET_VIDEO_FPS,
        MIN_TARGET_VIDEO_FPS,
        MAX_TARGET_VIDEO_FPS,
      );
      const preferred = clampNumber(
        Number.isFinite(preferredVideoFps) ? preferredVideoFps : INITIAL_TARGET_VIDEO_FPS,
        MIN_TARGET_VIDEO_FPS,
        MAX_TARGET_VIDEO_FPS,
      );
      const measuredRafFps = Number.isFinite(rafFps) && rafFps > 0 ? rafFps : preferred;
      const maximumFps = preferred;
      const displayMaximumFps = Math.min(
        maximumFps,
        Math.max(MIN_TARGET_VIDEO_FPS, measuredRafFps + FRAME_RATE_RAF_TOLERANCE_FPS),
      );
      const capacityEstimate = clampNumber(
        Number.isFinite(capacityEstimateFps) ? capacityEstimateFps : target,
        MIN_TARGET_VIDEO_FPS,
        maximumFps,
      );
      const stable = clampNumber(
        Math.floor(Number.isFinite(stableSamples) ? stableSamples : 0),
        0,
        FRAME_RATE_HEALTHY_SAMPLES_BEFORE_INCREASE,
      );
      const limited = clampNumber(
        Math.floor(Number.isFinite(limitedSamples) ? limitedSamples : 0),
        0,
        FRAME_RATE_LIMITED_SAMPLES_BEFORE_DECREASE,
      );
      if (measurementSuspended === true) {
        return {
          targetVideoFps: target,
          capacityEstimateFps: capacityEstimate,
          achievementRatio: 1,
          stableSamples: 0,
          limitedSamples: 0,
          maximumFps: displayMaximumFps,
          reason: 'measurement-suspended',
        };
      }

      const rafAchievement = clampNumber(
        (measuredRafFps + FRAME_RATE_RAF_TOLERANCE_FPS) / Math.max(1, target),
        0,
        1,
      );
      const timingAchievement = clampNumber(
        1 - (Number.isFinite(longRafRatio) ? Math.max(0, longRafRatio) : 0),
        0.5,
        1,
      );
      const outputAchievement = sourceLimited === true
        ? 1
        : clampNumber(
          Number.isFinite(presentationRatio) ? presentationRatio : 1,
          0,
          1,
        );
      const achievementRatio = Math.min(
        rafAchievement,
        timingAchievement,
        outputAchievement,
      );
      const localPerformanceLimited = achievementRatio < REQUIRED_PRESENTATION_RATIO;

      if (localPerformanceLimited) {
        const observedCapacityFps = Math.min(
          displayMaximumFps,
          Math.max(MIN_TARGET_VIDEO_FPS, target * achievementRatio),
        );
        const nextCapacityEstimate = observedCapacityFps >= capacityEstimate
          ? observedCapacityFps
          : capacityEstimate + (observedCapacityFps - capacityEstimate)
            * FRAME_RATE_CAPACITY_DECREASE_ALPHA;
        const nextLimitedSamples = Math.min(
          FRAME_RATE_LIMITED_SAMPLES_BEFORE_DECREASE,
          limited + 1,
        );
        if (nextLimitedSamples < FRAME_RATE_LIMITED_SAMPLES_BEFORE_DECREASE) {
          return {
            targetVideoFps: target,
            capacityEstimateFps: nextCapacityEstimate,
            achievementRatio,
            stableSamples: 0,
            limitedSamples: nextLimitedSamples,
            maximumFps: displayMaximumFps,
            reason: 'adaptive-decrease-pending',
          };
        }
        const desiredTarget = Math.min(
          displayMaximumFps,
          nextCapacityEstimate / REQUIRED_PRESENTATION_RATIO,
        );
        const minimumStepTarget = target * (1 - FRAME_RATE_MAX_DECREASE_FRACTION);
        const nextTarget = clampNumber(
          Math.max(desiredTarget, minimumStepTarget),
          MIN_TARGET_VIDEO_FPS,
          target,
        );
        return {
          targetVideoFps: nextTarget,
          capacityEstimateFps: nextCapacityEstimate,
          achievementRatio,
          stableSamples: 0,
          limitedSamples: 0,
          maximumFps: displayMaximumFps,
          reason: 'adaptive-decrease',
        };
      }

      const demonstratedCapacityFps = Math.max(
        capacityEstimate,
        Math.min(displayMaximumFps, target * achievementRatio),
      );
      const recoveryStrength = clampNumber(
        (achievementRatio - REQUIRED_PRESENTATION_RATIO)
          / (1 - REQUIRED_PRESENTATION_RATIO),
        0,
        1,
      );
      const recoveryAlpha = sourceLimited === true
        ? FRAME_RATE_SOURCE_RECOVERY_ALPHA
        : FRAME_RATE_CAPACITY_RECOVERY_ALPHA * recoveryStrength;
      const nextCapacityEstimate = demonstratedCapacityFps
        + (displayMaximumFps - demonstratedCapacityFps) * recoveryAlpha;
      const canRecover = target + FRAME_RATE_EPSILON_FPS < displayMaximumFps
        && nextCapacityEstimate / REQUIRED_PRESENTATION_RATIO
          > target + FRAME_RATE_EPSILON_FPS;
      const nextStableSamples = canRecover
        ? Math.min(FRAME_RATE_HEALTHY_SAMPLES_BEFORE_INCREASE, stable + 1)
        : 0;
      if (nextStableSamples >= FRAME_RATE_HEALTHY_SAMPLES_BEFORE_INCREASE) {
        const desiredTarget = Math.min(
          displayMaximumFps,
          nextCapacityEstimate / REQUIRED_PRESENTATION_RATIO,
        );
        const desiredStep = Math.max(
          FRAME_RATE_MIN_ADJUSTMENT_FPS,
          desiredTarget - target,
        );
        const maximumStep = Math.max(
          FRAME_RATE_MIN_ADJUSTMENT_FPS,
          target * FRAME_RATE_MAX_INCREASE_FRACTION,
        );
        return {
          targetVideoFps: Math.min(
            displayMaximumFps,
            target + Math.min(desiredStep, maximumStep),
          ),
          capacityEstimateFps: nextCapacityEstimate,
          achievementRatio,
          stableSamples: 0,
          limitedSamples: 0,
          maximumFps: displayMaximumFps,
          reason: sourceLimited === true ? 'source-independent-recover' : 'adaptive-increase',
        };
      }

      return {
        targetVideoFps: target,
        capacityEstimateFps: nextCapacityEstimate,
        achievementRatio,
        stableSamples: nextStableSamples,
        limitedSamples: 0,
        maximumFps: displayMaximumFps,
        reason: sourceLimited === true ? 'source-independent' : 'steady',
      };
    }

    function measureSourceVideoRate(frameCount, elapsedSeconds, firstPtsUs, lastPtsUs) {
      const sourceArrivalFps = frameCount / Math.max(0.001, elapsedSeconds);
      const sourcePtsElapsedUs = firstPtsUs !== null && lastPtsUs !== null
        ? lastPtsUs - firstPtsUs
        : 0;
      const sourcePtsFps = frameCount > 1 && sourcePtsElapsedUs > 0
        ? (frameCount - 1) * 1000000 / sourcePtsElapsedUs
        : 0;
      // 网络恢复时可能把已缓存的帧集中送来：到达率会瞬时偏高，但 PTS
      // 速率仍代表源的真实节奏。因此两者取小值，避免把突发误当作高帧率源。
      return {
        sourceArrivalFps,
        sourcePtsFps,
        measuredSourceFps: sourcePtsFps > 0
          ? Math.min(sourceArrivalFps, sourcePtsFps)
          : sourceArrivalFps,
      };
    }

    function evaluateSourceAvailability({
      targetVideoFps,
      sourceArrivalFps,
      sourcePtsFps,
    }) {
      const target = Math.max(1, Number.isFinite(targetVideoFps) ? targetVideoFps : 1);
      const arrivalFps = Math.max(0, Number.isFinite(sourceArrivalFps) ? sourceArrivalFps : 0);
      const ptsFps = Math.max(0, Number.isFinite(sourcePtsFps) ? sourcePtsFps : 0);
      // PTS 足够时同时要求真实媒体速率与到达速率，避免网络追赶突发把源供给
      // 夸大；低帧率窗口只有一帧时退回到达率，并直接归类为 sourceLimited。
      const sourceSupplyFps = ptsFps > 0 ? Math.min(arrivalFps, ptsFps) : arrivalFps;
      const expectedFps = Math.min(target, sourceSupplyFps);
      const sourceLimited = sourceSupplyFps + SOURCE_SUPPLY_TOLERANCE_FPS
        < target * SOURCE_SUPPLY_REQUIRED_RATIO;
      return { expectedFps, sourceLimited, sourceSupplyFps };
    }

    function medianOf(values) {
      if (!values.length) return null;
      const sorted = Array.from(values).sort((left, right) => left - right);
      const middle = sorted.length >> 1;
      return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
    }

    // 源帧间隔是否恰为整数个显示节拍。本地正在抽帧（目标低于源速率）时
    // 呈现由截止时间驱动，不存在可锁定的节拍。
    function presentationCadence({ displayIntervalMs, sourceFps, targetVideoFps }) {
      if (!(displayIntervalMs > 0) || !(sourceFps > 0)) {
        return { locked: false, ticksPerFrame: 0 };
      }
      if (Number.isFinite(targetVideoFps) && targetVideoFps + FRAME_RATE_EPSILON_FPS < sourceFps) {
        return { locked: false, ticksPerFrame: 0 };
      }
      const ratio = (1000 / sourceFps) / displayIntervalMs;
      const ticksPerFrame = Math.round(ratio);
      const locked = ticksPerFrame >= 1
        && Math.abs(ratio - ticksPerFrame) <= PRESENTATION_PHASE_CADENCE_TOLERANCE;
      return { locked, ticksPerFrame: locked ? ticksPerFrame : 0 };
    }

    // 相位定义为“帧变得可呈现的时刻到实际呈现的 rAF 时刻”的间隔占显示
    // 节拍的比例。呈现总在可呈现后的第一个 rAF 发生，因此相位落在 [0, 1)：
    // 接近 0 或 1 都意味着帧紧贴节拍边界，抖动会随机把它推到相邻节拍。
    // 返回值 correctionMs 为应当增加的呈现余量（把相位搬到 0.5）。
    function evaluatePresentationPhase({ sinSum, cosSum, count, displayIntervalMs, locked }) {
      if (!locked || !(count >= PRESENTATION_PHASE_MIN_SAMPLES) || !(displayIntervalMs > 0)) {
        return { resultant: 0, phase: null, correctionMs: 0 };
      }
      const resultant = Math.hypot(sinSum, cosSum) / count;
      let phase = Math.atan2(sinSum, cosSum) / (2 * Math.PI);
      if (phase < 0) phase += 1;
      if (resultant < PRESENTATION_PHASE_MIN_RESULTANT) {
        return { resultant, phase, correctionMs: 0 };
      }
      const edge = PRESENTATION_PHASE_EDGE_FRACTION;
      if (phase > edge && phase < 1 - edge) {
        return { resultant, phase, correctionMs: 0 };
      }
      let delta = 0.5 - phase;
      if (delta > 0.5) delta -= 1;
      if (delta < -0.5) delta += 1;
      return { resultant, phase, correctionMs: delta * displayIntervalMs };
    }

    // ============ 单流播放会话 ============
    class StreamSession {
      constructor(streamPath, flvUrl, canvas) {
        this.streamPath = streamPath;       // 解码后的流路径，用于匹配 sync-info
        this.flvUrl = flvUrl;
        this.canvas = canvas;
        this.context = canvas.getContext('2d', { alpha: false });
        this.running = true;
        this.fatal = false;
        this.reconnectTimer = 0;
        this.abortController = null;
        this.loopPromise = null;
        this.flvHeaderRead = false;
        this.lastFlvTimestampMs = null;
        this.flvTimestampWrapOffsetMs = 0;
        this.videoConfig = null;
        this.videoConfigKey = '';
        this.videoDecoder = null;

        this.videoInputBytes = 0;

        this.networkBufferBytes = 0;

        this.targetVideoFps = INITIAL_TARGET_VIDEO_FPS;

        // 而下调；target 才是依据本地展示性能临时探测出来的当前上限。
        this.preferredVideoFps = INITIAL_TARGET_VIDEO_FPS;
        this.sourceVideoFps = 0;
        this.sampledVideoFrames = 0;
        this.nextVideoPresentationMs = null;
        this.lastVideoPresentationMs = null;
        this.displayLagMs = 0;
        this.frameRateWindowStartMs = performance.now();
        this.frameRateWindowRafCount = 0;
        this.frameRateWindowLongRafCount = 0;
        this.lastRenderCallbackMs = null;
        this.frameRateWindowRenderedFrames = 0;

        this.audioContextResumeAttempts = 0;

      setFatal(message) {
        this.fatal = true;
        this.running = false;
        setStatus(message, true);
      }

      closeVideoDecoder() {
        this.decoderGeneration++;
        if (this.videoDecoder) {
          try { this.videoDecoder.close(); } catch (_) {}
        }
        this.videoDecoder = null;
        this.videoInput = [];
        this.videoInputBytes = 0;
        for (const frame of this.videoFrames) {
          try { frame.close(); } catch (_) {}
        }
        this.videoFrames = [];
        this.lastVideoOutputAt = performance.now();
      }

      closeAudioDecoderInstance(clearInput = true) {
        this.audioDecoderGeneration++;
        if (this.audioDecoder) {
          try { this.audioDecoder.close(); } catch (_) {}
        }
        this.audioDecoder = null;
        this.audioDecodeSubmitQueue = [];
        this.audioDecodeExcessSamples = 0;
        if (clearInput) this.audioInput = [];
        this.lastAudioOutputAt = performance.now();
      }

      // 丢弃已排入 FIFO 但尚未播出的声音并重新起播。解码器、连接和视频
      // 时间轴都不受影响；worklet 会对下一段数据做短淡入。
      resetAudioTimeline(reason) {
        if (this.audioWorkletNode && this.audioWorkletReady) {
          try {
            this.postAudioOutput({ type: 'flush' });
            this.audioFlushesRequested++;
          } catch (_) {}
        }
        this.audioFifoAssumeEmpty = true;
        this.audioPushedSinceStatus = 0;
        this.audioFifoPushedFrames = 0;
        this.audioFifoChunks = [];
        this.audioFifoStatus = null;
        this.audioFifoStatusAt = 0;
        this.audioFifoStatusHistory = [];
        this.audioFirstPushAt = 0;
        this.audioHoldFramesRequested = 0;
        this.audioOutputWaitStartedAt = performance.now();
        if (this.audioStretcher) this.audioStretcher.reset();
        this.audioResampler = null;
        this.audioStreamBaseUs = null;
        this.audioStreamExpectedUs = null;
        this.audioPendingPcm = [];
        this.audioPendingPcmFrames = 0;
        this.audioStreamRestartPending = false;
        this.audioStreamDiscontinuity = false;
        this.audioStartFresh = true;
        this.audioFreshAppend = true;
        this.audioSyncDeviation = 0;
        this.audioSyncErrorMs = null;
        this.lastHeardAudioPtsUs = null;
        this.audioSyncFilteredErrorMs = null;
        this.audioSyncUpdatedAt = 0;
        this.audioSyncHardErrorSince = null;
        this.audioStretchRate = this.playbackRate;
        if (this.audioStretcher) this.audioStretcher.setRate(this.audioStretchRate);
        this.lastAudioPtsUs = null;
        if (reason) this.lastAudioHardResyncReason = reason;
      }

      closeAudioDecoder() {
        this.closeAudioDecoderInstance();
        this.resetAudioTimeline('');
        this.lastAudioInputAt = 0;
        this.lastAudioDecodeSubmitAt = 0;
        this.oldestPendingAudioSubmitAt = 0;
        this.audioDecoderGraceUntil = 0;
      }

      resetPresentationPhase() {
        this.presentationPhaseSinSum = 0;
        this.presentationPhaseCosSum = 0;
        this.presentationPhaseCount = 0;
        this.presentationPhaseCorrectionMs = 0;
        this.presentationOffsetMs = 0;
      }

      resetPipeline() {
        this.closeVideoDecoder();
        this.closeAudioDecoder();
        this.resetAlignmentEvidence(true);
        this.flvHeaderRead = false;
        this.lastFlvTimestampMs = null;
        this.flvTimestampWrapOffsetMs = 0;
        this.networkBufferBytes = 0;
        this.videoConfig = null;
        this.videoConfigKey = '';
        this.audioConfig = null;
        this.audioConfigKey = '';
        this.waitingForKeyframe = true;
        this.mediaBaseUs = null;
        this.startPerfMs = null;
        this.lastInputPtsUs = null;
        this.lastDisplayedPtsUs = null;
        this.nextVideoPresentationMs = null;
        this.lastVideoPresentationMs = null;
        this.displayLagMs = 0;
        this.frameRateCapacityEstimateFps = this.preferredVideoFps;
        this.frameRateStableSamples = 0;
        this.frameRateLimitedSamples = 0;
        this.lastFrameRateAchievement = 1;
        this.lastFrameRateControlReason = 'pipeline-reset';
        this.resetPresentationPhase();
        if (this.context) this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
      }

      // 压缩视频队列上限随显示延迟增长：latent 只是把帧留在队列里等待按需
      // 解码，不应被当作积压。
      maxVideoInputFrames() {
        return Math.max(
          MAX_VIDEO_INPUT,
          Math.ceil(
            (playbackLatencyMs() + this.adaptiveLatentMs + 2000) / 1000
              * Math.max(30, this.preferredVideoFps),
          ),
        );
      }

      maxVideoInputBytes() {
        return Math.min(
          MAX_VIDEO_INPUT_BYTES_HARD,
          Math.max(
            MAX_VIDEO_INPUT_BYTES,
            (playbackLatencyMs() + this.adaptiveLatentMs + 2000) / 1000
              * VIDEO_INPUT_BYTES_PER_SECOND,
          ),
        );
      }

      trimVideoInput() {
        if (this.videoInput.length <= this.maxVideoInputFrames()
          && this.videoInputBytes <= this.maxVideoInputBytes()) {
          return;
        }

        let lastKey = -1;
        for (let index = this.videoInput.length - 1; index >= 0; index--) {
          if (this.videoInput[index].key) {
            lastKey = index;
            break;
          }
        }

        const keepFrom = lastKey > 0
          ? lastKey
          : Math.max(0, this.videoInput.length - this.maxVideoInputFrames());
        if (keepFrom <= 0) return;

        this.videoInput = this.videoInput.slice(keepFrom);
        this.videoInputBytes = this.videoInput.reduce(
          (bytes, item) => bytes + item.data.byteLength,
          0,
        );
        this.droppedFrames += keepFrom;
      }

      // A WebCodecs decoder can stop completing queued work after a bad
      // transition. Rebuilding it is much cheaper than letting every new frame
      // pile up in videoInput while decodeQueueSize remains pinned.
      recoverStalledVideoDecoder() {
        if (!this.videoDecoder || !this.videoInput.length) return;
        if (this.videoDecoder.decodeQueueSize === 0) {
          this.pumpVideo();
          return;
        }
        if (performance.now() - this.lastVideoOutputAt < 1000) return;

        setStatus('视频解码器停滞，正在重建…', true);
        const videoConfig = this.videoConfig;
        this.closeVideoDecoder();
        if (videoConfig) this.configureVideo(videoConfig);
      }

      audioDecoderStallThresholdMs() {
        const sampleRate = Number(this.audioConfig?.sampleRate);
        const fourAacFramesMs = Number.isFinite(sampleRate) && sampleRate > 0
          ? 4 * 1024 / sampleRate * 1000
          : MIN_AUDIO_DECODER_STALL_MS;
        return clampNumber(
          fourAacFramesMs,
          MIN_AUDIO_DECODER_STALL_MS,
          MAX_AUDIO_DECODER_STALL_MS,
        );
      }

      audioSampleRate() {
        return this.audioContext ? this.audioContext.sampleRate : (this.audioConfig?.sampleRate || 48000);
      }

      // FIFO 中尚未播出的帧数估计：以最近一次 worklet 状态为基准扣除此后
      // 已渲染的部分，再加上此后推入的数据。
      audioFifoQueuedFrames() {
        const pendingHoldFrames = Math.max(0,
          this.audioHoldFramesRequested - (this.audioFifoStatus?.holdFramesRequested || 0),
        );
        if (this.audioFifoAssumeEmpty || !this.audioFifoStatus || !this.audioContext) {
          return this.audioPushedSinceStatus + pendingHoldFrames;
        }
        const elapsedFrames = Math.max(0, this.audioContext.currentTime - this.audioFifoStatus.contextTime)
          * this.audioSampleRate();
        const holdFrames = this.audioFifoStatus.holdFrames || 0;
        return Math.max(0, this.audioFifoStatus.queuedFrames - Math.max(0, elapsedFrames - holdFrames))
          + Math.max(0, holdFrames - elapsedFrames) + pendingHoldFrames + this.audioPushedSinceStatus;
      }

      audioBufferedSeconds() {
        if (!this.audioContext) return 0;
        const stretcherFrames = this.audioStretcher ? this.audioStretcher.bufferedInputFrames() : 0;
        return (this.audioFifoQueuedFrames() + stretcherFrames + (this.audioPendingPcmFrames || 0))
          / this.audioSampleRate();
      }

      ensureAudioContextRunning(nowPerfMs = performance.now()) {
        const context = this.audioContext;
        if (!context || context.state === 'running' || context.state === 'closed') return;
        const retryMs = this.audioContextResumeAttempts < AUDIO_CONTEXT_RESUME_FAST_ATTEMPTS
          ? AUDIO_CONTEXT_RESUME_RETRY_MS
          : AUDIO_CONTEXT_RESUME_SLOW_RETRY_MS;
        if (this.lastAudioContextResumeAttemptAt > 0
          && nowPerfMs - this.lastAudioContextResumeAttemptAt < retryMs) return;
        this.lastAudioContextResumeAttemptAt = nowPerfMs;
        this.audioContextResumeAttempts++;
        context.resume().catch(() => {});
      }

      recoverStalledAudioDecoder(nowPerfMs = performance.now()) {
        const stallThresholdMs = this.audioDecoderStallThresholdMs();
        const reason = audioDecoderRecoveryReason({
          decoderReady: Boolean(this.audioDecoder),
          clockReady: this.audioOutputReady(),
          inputAgeMs: this.lastAudioDecodeSubmitAt > 0
            ? nowPerfMs - this.lastAudioDecodeSubmitAt
            : Number.MAX_SAFE_INTEGER,
          pendingAgeMs: this.oldestPendingAudioSubmitAt > 0
            ? nowPerfMs - this.oldestPendingAudioSubmitAt
            : 0,
          outputAgeMs: nowPerfMs - this.lastAudioOutputAt,
          bufferedSeconds: this.audioBufferedSeconds(),
          graceRemainingMs: Math.max(0, this.audioDecoderGraceUntil - nowPerfMs),
          recoveryAgeMs: this.lastAudioDecoderRecoveryAt > 0
            ? nowPerfMs - this.lastAudioDecoderRecoveryAt
            : Number.MAX_SAFE_INTEGER,
          stallThresholdMs,
          inputActiveWindowMs: Math.max(AUDIO_INPUT_ACTIVE_WINDOW_MS, stallThresholdMs * 3),
          recoveryBufferSeconds: stallThresholdMs / 1000 + 0.03,
        });
        if (!reason) return null;

        // 只替换停滞的 decoder 实例，保留 FIFO 中的声音和 PCM 流状态。
        // 判定不再依赖 decodeQueueSize/audioInput：两者都可能已被一个不输出
        // 回调的 decoder 消耗为 0。
        setStatus('音频解码输出停滞，正在快速无缝重建…', true);
        this.audioDecoderRecoveries++;
        this.lastAudioDecoderRecoveryAt = nowPerfMs;
        this.lastAudioDecoderRecoveryReason = reason;
        this.closeAudioDecoderInstance(false);
        this.audioInput = retainSchedulableAudioInput(this.audioInput, this.audioTargetUs());
        this.audioDecoderGraceUntil = nowPerfMs + stallThresholdMs;
        this.configureAudio();
        this.pumpAudio();
        return reason;
      }

      // 做了速率变化时的媒体位置连续重锚定，以防止出现切换控速瞬间跳帧或
      // 跳音的情况。音频侧由本地同步控制把伸缩比平滑地跟到新速率。
      setPlaybackRate(rate) {
        const next = synchronizeEnabled ? (sharedPlaybackClock?.playbackRate ?? 1)
          : Number.isFinite(rate) ? Math.min(1.1, Math.max(0.9, rate)) : 1;
        if (Math.abs(next - this.playbackRate) < 0.000001) return;
        const now = performance.now();
        const currentTarget = this.currentTargetUs(now);
        this.playbackRate = next;
        if (this.mediaBaseUs !== null && this.startPerfMs !== null) {
          this.startPerfMs = now
            - (currentTarget - this.mediaBaseUs) / (next * 1000);
        }
        this.updateAudioStretchRate();
      }

      updateAudioStretchRate() {
        const rate = clampNumber(
          this.playbackRate * (1 + this.audioSyncDeviation),
          synchronizeEnabled ? 1 - AUDIO_SYNC_TOTAL_MAX_DEVIATION : AUDIO_STRETCH_MIN_RATE,
          synchronizeEnabled ? 1 + AUDIO_SYNC_TOTAL_MAX_DEVIATION : AUDIO_STRETCH_MAX_RATE,
        );
        this.audioStretchRate = rate;
        if (this.audioStretcher) this.audioStretcher.setRate(rate);
      }

      // 取出与本次输出对应的提交记录。队列里最多只应留着解码器内部尚未出队
      // 的块外加在途的一两块；若解码器悄悄吞掉了某块，多出的旧记录会在反馈
      // 周期里被清掉，避免此后每个输出的媒体时间都错位一块。
      takeAudioDecodeSubmission() {
        return this.audioDecodeSubmitQueue.shift() || null;
      }

      reconcileAudioDecodeSubmissions() {
        const pending = this.audioDecoder ? this.audioDecoder.decodeQueueSize : 0;
        if (this.audioDecodeSubmitQueue.length > pending) {
          if (++this.audioDecodeExcessSamples >= 4) {
            this.audioDecodeSubmitQueue.shift();
            this.audioDecodeDroppedChunks++;
            this.audioDecodeExcessSamples = 0;
          }
        } else {
          this.audioDecodeExcessSamples = 0;
        }
      }

      observeAudioDecodeLatency(rawLatencyMs) {
        const latencyMs = Math.max(0, Number.isFinite(rawLatencyMs) ? rawLatencyMs : 0);
        this.audioDecodeLatencyMs = this.audioDecodeLatencyMs === null
          ? latencyMs
          : this.audioDecodeLatencyMs + (latencyMs - this.audioDecodeLatencyMs) * AUDIO_DECODE_LATENCY_ALPHA;
        this.audioDecodeLatencyPeakMs = Math.max(
          latencyMs,
          this.audioDecodeLatencyPeakMs * AUDIO_DECODE_LATENCY_PEAK_DECAY,
        );
      }

      // 视频解码也可能成为最慢一轨。持续赶不上呈现截止时间时请求同一个
      // 公共预算；一次批量输出的旧帧不会被按帧数误当成持续的处理延迟。
      observeVideoDecodeLead(timestampUs, nowPerfMs) {
        if (!synchronizeEnabled) return;
        const elapsedMs = this.lastVideoLeadObservedAt > 0 ? nowPerfMs - this.lastVideoLeadObservedAt : 0;
        this.lastVideoLeadObservedAt = nowPerfMs;
        const desiredPerfMs = this.perfTimeForMediaUs(timestampUs);
        if (desiredPerfMs === null) return;
        this.videoDecodeLeadMs = desiredPerfMs - nowPerfMs;
        const frameMs = 1000 / Math.max(1, this.targetVideoFps);
        const deficitMs = frameMs - (desiredPerfMs - nowPerfMs);
        if (deficitMs <= 0) {
          this.videoLeadDeficitSince = null;
          this.videoLeadDeficitWindowMs = 0;
          if (this.videoRequiredAlignmentDelayMs <= sourceAlignmentDelayMs
            || -deficitMs < ADAPTIVE_LATENT_SURPLUS_MS) {
            this.videoLatentSurplusSince = 0;
          } else if (this.videoLatentSurplusSince === 0) {
            this.videoLatentSurplusSince = nowPerfMs;
          } else if (nowPerfMs - this.videoLatentSurplusSince >= ADAPTIVE_LATENT_DECAY_HOLD_MS) {
            this.shiftAdaptiveLatent(-Math.min(
              this.videoRequiredAlignmentDelayMs - sourceAlignmentDelayMs,
              ADAPTIVE_LATENT_DECAY_MS_PER_SECOND * elapsedMs / 1000,
            ), nowPerfMs, 'video');
          }
          return;
        }
        this.videoLatentSurplusSince = 0;
        this.videoLeadDeficitWindowMs = Math.max(this.videoLeadDeficitWindowMs, deficitMs, frameMs * 2);
        const window = audioLateWindowStep({
          nowMs: nowPerfMs,
          startedAtMs: this.videoLeadDeficitSince,
          windowMs: this.videoLeadDeficitWindowMs,
        });
        this.videoLeadDeficitSince = window.startedAtMs;
        if (window.sustained) {
          this.shiftAdaptiveLatent(deficitMs, nowPerfMs, 'video');
          this.videoLeadDeficitSince = null;
          this.videoLeadDeficitWindowMs = 0;
        }
      }

      // 可疑时间戳需要跨过一个采集组确认；只看同批拆出的 AAC 包会把同一
      // 次采集时钟波动误当成持续丢帧。等待有帧数上限，不随异常时间戳增长。
      audioTimestampLookaheadMs(frames = 1024, sampleRate = this.audioSampleRate()) {
        const blockMs = frames / sampleRate * 1000;
        return Math.min((AUDIO_TIMESTAMP_PENDING_LIMIT - 1) * blockMs,
          Math.max(blockMs * 2, this.audioMediaGroupDurationMs(frames, sampleRate)));
      }

      // 一批 PCM 可拆成多个 AAC 包；批内包间距接近零并不代表下一批马上
      // 到达。完整批次/网络到达间隔和时间戳确认需要的余量，必须在解码、
      // WSOLA 前瞻、入队和调度余量之外保留，并交给同步组统一蓄水。
      requiredAudioLeadMs() {
        const decodeMs = this.audioDecodeLatencyMs === null
          ? 0
          : Math.max(this.audioDecodeLatencyMs, this.audioDecodeLatencyPeakMs * 0.5);
        const stretchMs = this.audioStretcher
          ? (this.audioStretcher.seek + this.audioStretcher.overlap) / this.audioSampleRate() * 1000
          : 0;
        const batchMs = Math.max(
          this.audioArrivalCadenceMs(0, this.audioSampleRate()),
          this.audioTimestampLookaheadMs(),
        );
        return batchMs + decodeMs + stretchMs
          + AUDIO_FIFO_PRIME_LEAD_SECONDS * 1000 + ADAPTIVE_LATENT_SAFETY_MS;
      }

      // 同一次发送端采集组会拆成多个 AAC 标签，并可能在同一个网络批次到达。
      // 媒体归组只使用发送端组时长（旧端退回 AAC 帧时长）；服务端实测网络
      // cadence 只决定观察窗口，不能把两个概念混在一起。
      observeAudioArrivalLead(timestampUs, nowPerfMs) {
        if (this.mediaBaseUs === null || this.startPerfMs === null) return;
        const leadMs = (timestampUs - this.audioTargetUs(nowPerfMs)) / 1000;
        const group = audioArrivalGroupStep({
          anchorUs: this.audioArrivalGroupAnchorUs,
          groupIndex: this.audioArrivalGroupIndex,
          minLeadMs: this.audioArrivalGroupMinLeadMs,
          minLeadObservedAtMs: this.audioArrivalGroupMinLeadObservedAt,
          timestampUs,
          leadMs,
          observedAtMs: nowPerfMs,
          groupDurationMs: this.audioMediaGroupDurationMs(0, this.audioSampleRate()),
        });
        this.audioArrivalGroupAnchorUs = group.anchorUs;
        this.audioArrivalGroupIndex = group.groupIndex;
        this.audioArrivalGroupMinLeadMs = group.minLeadMs;
        this.audioArrivalGroupMinLeadObservedAt = group.minLeadObservedAtMs;
        if (group.completed) {
          this.audioArrivalLeadMs = group.completed.leadMs;
