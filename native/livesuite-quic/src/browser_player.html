          this.audioArrivalLeadObservedAt = group.completed.observedAtMs;
          // 只有完整的新采集组才推进持续窗口；反馈轮询与同批 AAC 块均不能
          // 冒充新的时间证据。
          this.evaluateAdaptiveLatent(group.completed.observedAtMs, true);
        }
      }

      evaluateAdaptiveLatent(nowPerfMs = performance.now(), hasNewArrivalEvidence = false) {
        const elapsedEvaluationMs = this.lastAdaptiveLatentEvaluationAt > 0
          ? Math.max(0, nowPerfMs - this.lastAdaptiveLatentEvaluationAt)
          : 0;
        this.lastAdaptiveLatentEvaluationAt = nowPerfMs;
        if (!this.audioConfig || this.audioArrivalLeadMs === null
          || this.mediaBaseUs === null || this.startPerfMs === null) {
          this.adaptiveLatentDeficitSince = null;
          this.adaptiveLatentDeficitWindowMs = 0;
          return;
        }
        const sourceCadenceMs = this.audioArrivalCadenceMs(0, this.audioSampleRate());
        if (this.audioArrivalLeadObservedAt <= 0
          || (sourceCadenceMs > 0
            && nowPerfMs - this.audioArrivalLeadObservedAt > sourceCadenceMs)) {
          // 没有新的媒体采集组时不能把同一个旧标签反复计入窗口；断流或积压
          // 由丢弃迟到块恢复，不移动音视频时间轴。
          this.adaptiveLatentDeficitSince = null;
          this.adaptiveLatentDeficitWindowMs = 0;
          return;
        }
        const deficitMs = this.requiredAudioLeadMs() - this.audioArrivalLeadMs;
        if (deficitMs > 0) {
          this.adaptiveLatentSurplusSince = 0;
          if (!hasNewArrivalEvidence) return;
          // 本地余量不足也按真实经过时间确认，不能因反馈轮询变快或同一批
          // 音频触发多次检查而提前移动视频。窗口由当前实测缺口、解码/伸缩
          // 所需提前量及真实音频组时长共同决定，并在本轮观察中只扩不缩。
          this.adaptiveLatentDeficitWindowMs = Math.max(
            this.adaptiveLatentDeficitWindowMs,
            deficitMs,
            this.requiredAudioLeadMs(),
            sourceCadenceMs,
          );
          const deficitWindow = audioLateWindowStep({
            nowMs: nowPerfMs,
            startedAtMs: this.adaptiveLatentDeficitSince,
            windowMs: this.adaptiveLatentDeficitWindowMs,
          });
          this.adaptiveLatentDeficitSince = deficitWindow.startedAtMs;
          if (deficitWindow.sustained) {
            this.shiftAdaptiveLatent(deficitMs, nowPerfMs);
            this.adaptiveLatentDeficitSince = null;
            this.adaptiveLatentDeficitWindowMs = 0;
          }
          return;
        }
        this.adaptiveLatentDeficitSince = null;
        this.adaptiveLatentDeficitWindowMs = 0;
        const extraDelayMs = synchronizeEnabled
          ? Math.max(0, this.audioRequiredAlignmentDelayMs - sourceAlignmentDelayMs)
          : this.adaptiveLatentMs;
        if (extraDelayMs <= 0 || -deficitMs < ADAPTIVE_LATENT_SURPLUS_MS) {
          this.adaptiveLatentSurplusSince = 0;
          return;
        }
        if (this.adaptiveLatentSurplusSince === 0) {
          this.adaptiveLatentSurplusSince = nowPerfMs;
          return;
        }
        if (nowPerfMs - this.adaptiveLatentSurplusSince < ADAPTIVE_LATENT_DECAY_HOLD_MS) return;
        this.shiftAdaptiveLatent(
          -Math.min(
            extraDelayMs,
            ADAPTIVE_LATENT_DECAY_MS_PER_SECOND * elapsedEvaluationMs / 1000,
          ),
          nowPerfMs,
        );
      }

      // 整体平移本地播放时间轴：视频呈现时刻与音频目标一起后移/前移。已经
      // 排入 FIFO 的声音由本地同步控制以听不出的速率跟到新目标。
      get requiredAlignmentDelayMs() {
        return Math.max(this.audioRequiredAlignmentDelayMs, this.videoRequiredAlignmentDelayMs);
      }

      resetAlignmentEvidence(clearBudget = false) {
        this.audioArrivalLeadMs = null;
        this.audioArrivalLeadObservedAt = 0;
        this.audioArrivalGroupAnchorUs = null;
        this.audioArrivalGroupIndex = null;
        this.audioArrivalGroupMinLeadMs = null;
        this.audioArrivalGroupMinLeadObservedAt = 0;
        this.adaptiveLatentDeficitSince = null;
        this.adaptiveLatentDeficitWindowMs = 0;
        this.videoLeadDeficitSince = null;
        this.videoLeadDeficitWindowMs = 0;
        this.adaptiveLatentSurplusSince = 0;
        this.videoLatentSurplusSince = 0;
        if (clearBudget) {
          this.audioRequiredAlignmentDelayMs = 0;
          this.videoRequiredAlignmentDelayMs = 0;
          this.audioDecodeLatencyMs = null;
          this.audioDecodeLatencyPeakMs = 0;
          this.lastAlignmentRequest = null;
          this.videoDecodeLeadMs = null;
        }
      }

      shiftAdaptiveLatent(deltaMs, nowPerfMs = performance.now(), track = 'audio') {
        if (synchronizeEnabled) {
          // 同步模式只能请求公共预算，不能平移这一页的主时钟。请求以当前
          // 时钟的实际延迟为基准；公共时钟尚在缓慢降速蓄水时，不能把尚未
          // 实现的目标延迟重复加进请求。
          const originServerMs = originByPath.get(this.streamPath);
          const actualDelayMs = serverOffsetMs !== null && Number.isFinite(originServerMs)
            ? nowPerfMs + serverOffsetMs - originServerMs - this.currentTargetUs(nowPerfMs) / 1000
              - EXTRA_LATENT_MS * this.playbackRate
            : alignmentDelayMs;
          const field = track === 'video' ? 'videoRequiredAlignmentDelayMs' : 'audioRequiredAlignmentDelayMs';
          const requested = deltaMs >= 0
            ? Math.max(this[field], actualDelayMs + deltaMs)
            : Math.min(this[field], alignmentDelayMs) + deltaMs;
          const next = clampNumber(requested, 0, ADAPTIVE_LATENT_MAX_MS);
          if (next > this[field] + 0.5) {
            this.sharedAlignmentRequests++;
            this.lastAlignmentRequest = {
              track, deltaMs, actualDelayMs, requestedDelayMs: next,
              clockRevision: sharedPlaybackClock?.revision ?? null,
              audioArrivalLeadMs: this.audioArrivalLeadMs,
              audioRequiredLeadMs: this.requiredAudioLeadMs(),
              audioDecodeLatencyMs: this.audioDecodeLatencyMs,
              videoDecodeLeadMs: this.videoDecodeLeadMs,
            };
          }
          this[field] = next;
          if (deltaMs >= 0) this.adaptiveLatentSurplusSince = 0;
          return 0;
        }
        const next = clampNumber(this.adaptiveLatentMs + deltaMs, 0, ADAPTIVE_LATENT_MAX_MS);
        const applied = next - this.adaptiveLatentMs;
        if (Math.abs(applied) < 0.5) return 0;
        this.adaptiveLatentMs = next;
        if (this.startPerfMs !== null) this.startPerfMs += applied / this.playbackRate;
        if (this.audioArrivalLeadMs !== null) this.audioArrivalLeadMs += applied;
        if (this.audioArrivalGroupMinLeadMs !== null) {
          this.audioArrivalGroupMinLeadMs += applied;
        }
        if (applied > 0) {
          this.adaptiveLatentIncreases++;
        }
        this.adaptiveLatentSurplusSince = 0;
        return applied;
      }

      // 同步模式完全跟随公共时钟；非同步模式仍可把本地临时延迟转交给
      // 服务端预算，避免两层重复叠加。
      applyServerAlignmentDelay(deltaMs) {
        if (!Number.isFinite(deltaMs) || Math.abs(deltaMs) < 0.5) return;
        if (synchronizeEnabled) {
          // 延迟变化由公共时钟锚点和速率统一表达，不能再单独平移这一页。
          return;
        }
        let remainingMs = deltaMs;
        if (remainingMs > 0 && this.adaptiveLatentMs > 0) {
          const transferredMs = Math.min(remainingMs, this.adaptiveLatentMs);
          this.adaptiveLatentMs -= transferredMs;
          remainingMs -= transferredMs;
          this.serverAlignmentTransfers++;
          this.serverAlignmentTransferredMs += transferredMs;
          this.adaptiveLatentSurplusSince = 0;
        }
        if (this.startPerfMs !== null && this.lastDisplayedPtsUs === null
          && Math.abs(remainingMs) >= 0.5) {
          this.startPerfMs += remainingMs / this.playbackRate;
          if (this.audioArrivalLeadMs !== null) this.audioArrivalLeadMs += remainingMs;
          if (this.audioArrivalGroupMinLeadMs !== null) {
            this.audioArrivalGroupMinLeadMs += remainingMs;
          }
          this.serverAlignmentStartupShifts++;
        }
      }

      // 视频时间轴始终使用 performance.now。AudioContext 仅用于输出声音，
      // 不能反过来当视频主时钟：音频解码偶发迟到时若把整个主时钟向后推，
      // 这个小误差会在长时间播放中不断累加，最终造成画面数秒停滞。
      currentTargetUs(nowPerfMs = performance.now()) {
        if (this.mediaBaseUs === null) return 0;
        const originServerMs = originByPath.get(this.streamPath);
        if (synchronizeEnabled && serverOffsetMs !== null && Number.isFinite(originServerMs)) {
          if (sharedPlaybackClock) {
            return sharedPlaybackClock.anchorPositionUs - originServerMs * 1000
              + (nowPerfMs + serverOffsetMs - sharedPlaybackClock.anchorServerMs - EXTRA_LATENT_MS)
                * sharedPlaybackClock.playbackRate * 1000;
          }
          return (nowPerfMs + serverOffsetMs - originServerMs - playbackLatencyMs()) * 1000;
        }
        if (this.startPerfMs === null) return this.mediaBaseUs;
        const elapsedPerfMs = Math.max(0, nowPerfMs - this.startPerfMs);
        return this.mediaBaseUs + elapsedPerfMs * this.playbackRate * 1000;
      }

      // 媒体时间对应的本机显示时刻（currentTargetUs 的反函数）。
      perfTimeForMediaUs(mediaUs) {
        if (this.mediaBaseUs === null || this.startPerfMs === null) return null;
        const originServerMs = originByPath.get(this.streamPath);
        if (synchronizeEnabled && serverOffsetMs !== null && Number.isFinite(originServerMs)) {
          if (sharedPlaybackClock) {
            return sharedPlaybackClock.anchorServerMs - serverOffsetMs + EXTRA_LATENT_MS
              + (originServerMs * 1000 + mediaUs - sharedPlaybackClock.anchorPositionUs)
                / (sharedPlaybackClock.playbackRate * 1000);
          }
          return originServerMs + mediaUs / 1000 + playbackLatencyMs() - serverOffsetMs;
        }
        return this.startPerfMs + (mediaUs - this.mediaBaseUs) / (this.playbackRate * 1000);
      }

      observeSourceVideoRate(timestampUs) {
        this.frameRateWindowSourceFrames++;
        if (!Number.isFinite(timestampUs)) return;
        if (this.frameRateWindowSourceFirstPtsUs === null) {
          this.frameRateWindowSourceFirstPtsUs = timestampUs;
          this.frameRateWindowSourceLastPtsUs = timestampUs;
          return;
        }
        // B 帧或重连可能带来回退 PTS；它们不应把这一小段统计窗口的源速率
        // 误判为 0，只使用窗口中的最大 PTS 来估算媒体时间跨度。
        if (this.frameRateWindowSourceLastPtsUs === null
          || timestampUs >= this.frameRateWindowSourceLastPtsUs) {
          this.frameRateWindowSourceLastPtsUs = timestampUs;
        }
      }

      updateSourceVideoRate(measuredFps) {
        if (!Number.isFinite(measuredFps) || measuredFps <= 0) return;
        const boundedFps = Math.min(MAX_TARGET_VIDEO_FPS, measuredFps);
        if (this.sourceVideoFps <= 0) {
          this.sourceVideoFps = boundedFps;
        } else {
          // 仅作为诊断与轻微提前呈现量的当前源速率；快速跟随上升、缓慢跟随
          // 静止画面的 VFR 下降，但绝不用于下调本地 target/preferred。
          const alpha = boundedFps >= this.sourceVideoFps ? 0.5 : 0.2;
          this.sourceVideoFps += (boundedFps - this.sourceVideoFps) * alpha;
        }
        if (boundedFps > this.preferredVideoFps + FRAME_RATE_EPSILON_FPS) {
          this.preferredVideoFps = boundedFps;
        }
      }

      setTargetVideoFps(value) {
        const bounded = clampNumber(
          Number.isFinite(value) ? value : INITIAL_TARGET_VIDEO_FPS,
          MIN_TARGET_VIDEO_FPS,
          MAX_TARGET_VIDEO_FPS,
        );
        const next = Math.round(bounded * 10) / 10;
        if (Math.abs(next - this.targetVideoFps) < 0.25) return;
        this.targetVideoFps = next;
        // 保留上一张真正呈现帧的相位，只改变下一截止时间。这样降档和恢复
        // 都不会在切换瞬间连续画两张或额外空一拍。
        this.nextVideoPresentationMs = this.lastVideoPresentationMs === null
          ? null
          : this.lastVideoPresentationMs + 1000 / this.targetVideoFps;
        this.trimVideoOutput();
      }

      videoPresentationIsDue(now) {
        // 满刷新率输出已由 rAF 限频，不能再用带亚毫秒误差的第二个截止时间
        // 拦下一次 vsync；那会把 60fps 误采样成 30/40fps。
        if (this.displayIntervalMs > 0
          && this.targetVideoFps >= 1000 / this.displayIntervalMs - FRAME_RATE_RAF_TOLERANCE_FPS) {
          return true;
        }
        return this.nextVideoPresentationMs === null
          || now + VIDEO_PRESENTATION_EPSILON_MS >= this.nextVideoPresentationMs;
      }

      trimVideoOutput() {
        while (this.videoFrames.length > 1) {
          const first = this.videoFrames[0];
          const last = this.videoFrames[this.videoFrames.length - 1];
          const outputAheadUs = Number(last.timestamp) - Number(first.timestamp);
          if (this.videoFrames.length <= MAX_VIDEO_OUTPUT
            && (!Number.isFinite(outputAheadUs) || outputAheadUs <= MAX_VIDEO_OUTPUT_AHEAD_US)) {
            break;
          }
          const dropped = this.videoFrames.shift();
          if (dropped) {
            try { dropped.close(); } catch (_) {}
          }
          this.droppedFrames++;
        }
      }

      queueDecodedVideoFrame(frame) {
        // 不在解码回调里按浮点 PTS 阈值抽帧。FLV 的毫秒时间戳会让 60fps
        // 呈 16/17ms 交替，旧算法会误产出 16/33ms 的 40fps 锯齿。所有短窗
        // 输出交给 rAF 截止时间统一选择，超期帧只在同一次呈现中均匀丢弃。
        const timestampUs = Number(frame.timestamp);
        if (this.lastDisplayedPtsUs !== null && timestampUs <= this.lastDisplayedPtsUs) {
          this.sampledVideoFrames++;
          this.droppedFrames++;
          frame.close();
          return;
        }
        const lastFrame = this.videoFrames[this.videoFrames.length - 1];
        if (!lastFrame || Number(lastFrame.timestamp) <= timestampUs) {
          this.videoFrames.push(frame);
        } else {
          let insertion = this.videoFrames.length - 1;
          while (insertion > 0
            && Number(this.videoFrames[insertion - 1].timestamp) > timestampUs) {
            insertion--;
          }
          this.videoFrames.splice(insertion, 0, frame);
        }
        this.trimVideoOutput();
      }

      observeFrameRate(now) {
        this.frameRateWindowRafCount++;
        if (this.lastRenderCallbackMs !== null) {
          const rafIntervalMs = now - this.lastRenderCallbackMs;
          const expectedIntervalMs = 1000 / Math.max(1, this.targetVideoFps);
          if (rafIntervalMs > expectedIntervalMs * 1.5) {
            this.frameRateWindowLongRafCount++;
          }
          if (rafIntervalMs > 0) {
            this.rafIntervalSamples.push(rafIntervalMs);
            if (this.rafIntervalSamples.length > RAF_INTERVAL_SAMPLE_LIMIT) {
              this.rafIntervalSamples.shift();
            }
          }
        }
        this.lastRenderCallbackMs = now;
        const elapsedMs = now - this.frameRateWindowStartMs;
        if (elapsedMs < FRAME_RATE_SAMPLE_INTERVAL_MS) return;

        const elapsedSeconds = elapsedMs / 1000;
        const rafFps = this.frameRateWindowRafCount / elapsedSeconds;
        const renderedFrames = this.renderedFrames - this.frameRateWindowRenderedFrames;
        const sourceFrameCount = this.frameRateWindowSourceFrames;
        const sourceRate = measureSourceVideoRate(
          sourceFrameCount,
          elapsedSeconds,
          this.frameRateWindowSourceFirstPtsUs,
          this.frameRateWindowSourceLastPtsUs,
        );
        this.lastMeasuredSourceArrivalFps = sourceRate.sourceArrivalFps;
        this.lastMeasuredSourcePtsFps = sourceRate.sourcePtsFps;
        this.lastMeasuredSourceFps = sourceRate.measuredSourceFps;
        if (sourceFrameCount >= 2) {
          this.updateSourceVideoRate(sourceRate.measuredSourceFps);
        }

        const sourceAvailability = evaluateSourceAvailability({
          targetVideoFps: this.targetVideoFps,
          sourceArrivalFps: sourceRate.sourceArrivalFps,
          sourcePtsFps: sourceRate.sourcePtsFps,
        });
        const expectedFps = sourceAvailability.expectedFps;
        const presentationRatio = expectedFps > 0
          ? renderedFrames / (expectedFps * elapsedSeconds)
          : 1;
        const presentationFps = renderedFrames / elapsedSeconds;
        const renderCostLimited = renderedFrames > 0
          && this.frameRateWindowDrawCostMs / renderedFrames > 500 / this.targetVideoFps;
        const intervalSamples = this.frameRateWindowPresentationIntervals;
        const meanPresentationIntervalMs = intervalSamples > 0
          ? this.frameRateWindowPresentationIntervalSumMs / intervalSamples
          : 0;
        const presentationIntervalVarianceMs2 = intervalSamples > 0
          ? Math.max(
            0,
            this.frameRateWindowPresentationIntervalSquareSumMs / intervalSamples
              - meanPresentationIntervalMs * meanPresentationIntervalMs,
          )
          : 0;
        const longRafRatio = this.frameRateWindowRafCount > 0
          ? this.frameRateWindowLongRafCount / this.frameRateWindowRafCount
          : 0;
        this.lastMeasuredRafFps = rafFps;
        this.lastMeasuredPresentationFps = presentationFps;
        this.lastPresentationIntervalVarianceMs2 = presentationIntervalVarianceMs2;
        this.lastPresentationIntervalStdDevMs = Math.sqrt(presentationIntervalVarianceMs2);
        this.lastPresentationRatio = presentationRatio;
        this.lastLongRafRatio = longRafRatio;

        const sourceLimited = sourceAvailability.sourceLimited;
        // 源流从掉帧状态恢复的第一窗口，解码器和 canvas 仍可能在等关键帧或
        // 消化刚到的数据。该窗口同样不能把展示偏低归咎于本地性能。
        const sourceRecovering = !sourceLimited && this.lastSourceLimited;
        this.lastSourceLimited = sourceLimited;
        this.lastSourceRecovering = sourceRecovering;
        const hasRecentVideoOutput = now - this.lastVideoOutputAt < 1500;
        const decoderBacklogged = this.videoInput.length > this.maxVideoInputFrames() / 3
          || this.videoInputBytes > this.maxVideoInputBytes() / 3
          || (this.videoDecoder ? this.videoDecoder.decodeQueueSize >= 7 : false);
        // 仅保留为 debug 诊断；它不能进入展示帧率控制，因为降低 canvas
        // 频率不会减少预测编码视频必须执行的解码工作。
        this.lastFrameRateBacklogged = decoderBacklogged;
        const measuredDisplayMs = medianOf(this.rafIntervalSamples);
        const phaseAcquiring = presentationCadence({
          displayIntervalMs: measuredDisplayMs || 0,
          sourceFps: this.sourceVideoFps * this.playbackRate,
          targetVideoFps: this.targetVideoFps,
        }).locked && this.presentationCadenceLockedSamples < PRESENTATION_CADENCE_LOCK_SAMPLES;
        if (Number.isFinite(rafFps) && rafFps > 0) {
          const control = evaluateFrameRateControl({
            targetVideoFps: this.targetVideoFps,
            preferredVideoFps: this.preferredVideoFps,
            rafFps,
            presentationRatio,
            longRafRatio,
            // 源 VFR、断流、刚恢复或等待关键帧时，呈现数不能代表本地性能。
            // 控制器仍使用健康 rAF 恢复目标，因此静止画面不会冻结低帧率。
            sourceLimited: sourceLimited || sourceRecovering
              || this.waitingForKeyframe || !hasRecentVideoOutput
              || phaseAcquiring || this.presentationPhaseCorrectionMs !== 0
              // 漏呈现只有在实测绘制耗时过高时才是本地容量证据。网络缺帧、
              // 相位校正与解码等待不能触发“降目标后继续漏帧”的自我降档。
              || !renderCostLimited,
            measurementSuspended: document.hidden,
            capacityEstimateFps: this.frameRateCapacityEstimateFps,
            stableSamples: this.frameRateStableSamples,
            limitedSamples: this.frameRateLimitedSamples,
          });
          this.setTargetVideoFps(control.targetVideoFps);
          this.frameRateCapacityEstimateFps = control.capacityEstimateFps;
          this.frameRateStableSamples = control.stableSamples;
          this.frameRateLimitedSamples = control.limitedSamples;
          this.lastFrameRateAchievement = control.achievementRatio;
          this.lastFrameRateControlReason = control.reason;
        } else {
          // 无有效 rAF 样本时既不降低容量估计也不累计恢复，等待可见页面的
          // 下一窗口重新判断。
          this.frameRateStableSamples = 0;
          this.frameRateLimitedSamples = 0;
          this.lastFrameRateControlReason = 'invalid-raf-sample';
        }

        // 相位居中：只在源节拍与显示节拍整数对齐且本窗口呈现相位集中时
        // 才搬移，且只搬向两个 vsync 的正中。
        const medianRafMs = medianOf(this.rafIntervalSamples);
        if (medianRafMs !== null && medianRafMs >= 1 && medianRafMs <= 100) {
          this.displayIntervalMs = medianRafMs;
        }
        const cadence = presentationCadence({
          displayIntervalMs: this.displayIntervalMs,
          sourceFps: this.sourceVideoFps * this.playbackRate,
          targetVideoFps: this.targetVideoFps,
        });
        this.presentationCadenceLocked = cadence.locked;
        this.presentationTicksPerFrame = cadence.ticksPerFrame;
        this.presentationCadenceLockedSamples = cadence.locked
          ? this.presentationCadenceLockedSamples + 1
          : 0;
        const phase = evaluatePresentationPhase({
          sinSum: this.presentationPhaseSinSum,
          cosSum: this.presentationPhaseCosSum,
          count: this.presentationPhaseCount,
          displayIntervalMs: this.displayIntervalMs,
          locked: this.presentationCadenceLockedSamples >= PRESENTATION_CADENCE_LOCK_SAMPLES
            && !document.hidden && hasRecentVideoOutput && !sourceRecovering,
        });
        this.lastPresentationPhase = phase.phase;
        this.lastPresentationPhaseResultant = phase.resultant;
        if (phase.correctionMs !== 0 && this.presentationPhaseCorrectionMs === 0) {
          this.presentationPhaseCorrectionMs = phase.correctionMs;
          this.presentationPhaseCorrections++;
        }
        this.presentationPhaseSinSum = 0;
        this.presentationPhaseCosSum = 0;
        this.presentationPhaseCount = 0;

        this.frameRateWindowStartMs = now;
        this.frameRateWindowRafCount = 0;
        this.frameRateWindowLongRafCount = 0;
        this.frameRateWindowRenderedFrames = this.renderedFrames;
        this.frameRateWindowPresentationIntervals = 0;
        this.frameRateWindowPresentationIntervalSumMs = 0;
        this.frameRateWindowPresentationIntervalSquareSumMs = 0;
        this.frameRateWindowSourceFrames = 0;
        this.frameRateWindowDrawCostMs = 0;
        this.frameRateWindowSourceFirstPtsUs = null;
        this.frameRateWindowSourceLastPtsUs = null;
      }

      playbackMetrics() {
        let videoBufferBytes = this.networkBufferBytes;
        for (const item of this.videoInput) videoBufferBytes += item.data.byteLength;
        const videoGapCount = this.videoInput.length + this.videoFrames.length
          + (this.videoDecoder ? this.videoDecoder.decodeQueueSize : 0);
        const sampleRate = this.audioSampleRate();
        const fifoFrames = this.audioFifoQueuedFrames()
          + (this.audioStretcher ? this.audioStretcher.bufferedInputFrames() : 0)
          + (this.audioPendingPcmFrames || 0);
        const audioFrameCount = this.audioInput.length
          + (this.audioDecoder ? this.audioDecoder.decodeQueueSize : 0)
          + Math.round(fifoFrames / 1024);
        // 做了真实已排程音频时长的统计，以防止出现服务端只按帧数误判水位的情况。
        // 尚未解码的压缩块也是真实余量：它们只是按显示时刻等待按需解码。
        const compressedMs = this.audioInput.length * 1024 / sampleRate * 1000;
        const audioBufferedMs = this.audioContext
          ? Math.max(
            0,
            fifoFrames / sampleRate + audioOutputLatencySeconds(this.audioContext),
          ) * 1000 + compressedMs
          : 0;
        const playbackClockMs = serverOffsetMs === null
          ? null
          : performance.now() + serverOffsetMs;
        const originServerMs = originByPath.get(this.streamPath);
        // 做了页面 latent 的媒体时间补回，以防止出现服务端把用户设置的显示
        // 延迟误判为设备时钟漂移的情况。
        const toServerPlaybackPositionUs = (ptsUs) => Number.isFinite(originServerMs)
          ? originServerMs * 1000 + ptsUs
            + (EXTRA_LATENT_MS + (synchronizeEnabled ? 0 : this.adaptiveLatentMs))
              * this.playbackRate * 1000
          : null;
        const playbackPositionUs = this.lastDisplayedPtsUs !== null
          ? toServerPlaybackPositionUs(this.lastDisplayedPtsUs)
          : null;
        const toServerAudioPositionUs = (ptsUs) => toServerPlaybackPositionUs(ptsUs)
          + (EXTRA_AUDIO_LATENT_MS + this.displayLagMs) * this.playbackRate * 1000;
        // 恢复只能落在各必要轨道共同持有的区间内。取仍可消费的数据，
        // 不把曾经收到/显示过的最后时间戳当成可重放缓存。
        const videoTimes = [...this.videoInput.map((item) => item.timestampUs),
          ...this.videoFrames.map((frame) => Number(frame.timestamp))];
        const audioTimes = [...this.audioInput.map((item) => item.timestampUs),
          ...this.audioDecodeSubmitQueue.map((item) => item.timestampUs),
          ...this.audioPendingPcm.map((item) => item.timestampUs)];
        for (const chunk of this.audioFifoChunks) {
          if (chunk.fifoStart + chunk.frames > (this.audioFifoStatus?.consumedFrames ?? 0)
            && Number.isFinite(chunk.mediaUs)) {
            audioTimes.push(chunk.mediaUs, chunk.mediaUs + chunk.frames / sampleRate * chunk.rate * 1e6);
          }
        }
        let bufferedStartUs = videoTimes.length ? toServerPlaybackPositionUs(Math.min(...videoTimes)) : null;
        let bufferedEndUs = videoTimes.length ? toServerPlaybackPositionUs(Math.max(...videoTimes)) : null;
        if (this.audioConfig) {
          bufferedStartUs = bufferedStartUs === null || !audioTimes.length || !this.audioOutputReady() ? null
            : Math.max(bufferedStartUs, toServerAudioPositionUs(Math.min(...audioTimes)));
          bufferedEndUs = bufferedEndUs === null || !audioTimes.length || !this.audioOutputReady() ? null
            : Math.min(bufferedEndUs, toServerAudioPositionUs(Math.max(...audioTimes)));
        }
        return {
          clientId: playbackClientId,
          playerBuildId: PLAYER_BUILD_ID,
          streamPath: this.streamPath,
          videoBufferBytes,
          videoGapCount,
          audioFrameCount,
          audioBufferedMs,
          requiredAlignmentDelayMs: synchronizeEnabled ? this.requiredAlignmentDelayMs : 0,
          audioRequiredAlignmentDelayMs: synchronizeEnabled ? this.audioRequiredAlignmentDelayMs : 0,
          videoRequiredAlignmentDelayMs: synchronizeEnabled ? this.videoRequiredAlignmentDelayMs : 0,
          alignmentRequest: this.lastAlignmentRequest,
          hasAudio: Boolean(this.audioConfig !== null && this.audioOutputReady()),
          playbackPositionUs,
          audioPlaybackStarted: this.audioSyncErrorMs !== null,
          audioPlaybackPositionUs: this.lastHeardAudioPtsUs !== null && Number.isFinite(originServerMs)
            ? toServerAudioPositionUs(this.lastHeardAudioPtsUs) : null,
          bufferedStartUs,
          bufferedEndUs,
          // 主时钟已接受速率的确认负责可靠去重；位置始终使用真实展示帧，
          // 不能用“假设控速已完成”的时钟值提前结束纠偏。
          appliedPlaybackRate: this.playbackRate,
          playbackClockMs,
        };
      }

      async sendPlaybackFeedback() {
        if (!this.running || this.fatal || this.feedbackInFlight) return;
        this.feedbackInFlight = true;
        try {
          this.recoverStalledVideoDecoder();
          this.pumpVideo();
          this.ensureAudioContextRunning();
          this.pumpAudio();
          this.recoverStalledAudioDecoder();
          this.recoverAudioSyncHealth();
          this.reconcileAudioDecodeSubmissions();
          this.evaluateAdaptiveLatent();
          this.watchAudioOutputHealth();
          const frameBacklog = this.videoFrames.length
            + (this.videoDecoder ? this.videoDecoder.decodeQueueSize : 0);
          const videoDegraded = frameBacklog > MAX_VIDEO_OUTPUT + 8
            || this.videoInput.length > this.maxVideoInputFrames()
            || this.videoInputBytes > this.maxVideoInputBytes();
          this.videoDegradedSamples = videoDegraded ? this.videoDegradedSamples + 1 : 0;
          if (this.videoDegradedSamples >= DEGRADED_VIDEO_RECOVERY_SAMPLES) {
            this.recoverDegradedVideoPipeline();
          }
          const control = await fetchJsonWithTimeout(PLAYBACK_FEEDBACK_URL, {
            method: 'POST',
            cache: 'no-store',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.playbackMetrics())
          }, PLAYBACK_FEEDBACK_TIMEOUT_MS);
          if (!control) return;
          applySharedPlaybackClock(control.sharedPlaybackClock);
          if (Number.isFinite(control.playbackRate)) {
            applyPlaybackRate(control.playbackRate, this.streamPath);
          }
        } catch (_) {
          // 播放反馈是辅助控制通道,短暂失败不应中断媒体流。
        } finally {
          this.feedbackInFlight = false;
        }
      }

      recoverDegradedVideoPipeline() {
        if (!this.running || this.fatal) return;
        this.videoDegradedSamples = 0;
        this.videoPipelineRecoveries++;
        setStatus('视频解码管线持续积压，正在等待关键帧恢复…', true);
        const videoConfig = this.videoConfig;
        this.closeVideoDecoder();
        this.waitingForKeyframe = true;
        if (videoConfig) this.configureVideo(videoConfig);
      }

      resetForRealignment() {
        // 保留当前 FLV 中已经收到的音视频配置,只清掉编码帧和时间轴;
        // 这样运行中切换同步开关时无需等待服务端再次发送配置帧。
        this.closeVideoDecoder();
        this.closeAudioDecoder();
        this.adaptiveLatentMs = 0;
        this.audioRequiredAlignmentDelayMs = 0;
        this.videoRequiredAlignmentDelayMs = 0;
        this.videoLeadDeficitSince = null;
        this.videoLeadDeficitWindowMs = 0;
        this.setPlaybackRate(1);
        this.waitingForKeyframe = true;
        this.mediaBaseUs = null;
        this.startPerfMs = null;
        this.lastInputPtsUs = null;
        this.lastDisplayedPtsUs = null;
        this.frameRateCapacityEstimateFps = this.preferredVideoFps;
        this.frameRateStableSamples = 0;
        this.frameRateLimitedSamples = 0;
        this.lastFrameRateAchievement = 1;
        this.lastFrameRateControlReason = 'realignment-reset';
        this.resetPresentationPhase();
        if (this.context) this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
        setStatus('正在重新对齐播放器时钟…');
      }

      // 建立播放时间轴：FLV 时间戳已落在服务端时钟轴（首帧即流的服务端
      // 采集起点 + 相对偏移）。同步开启且已知起点时，把首帧的显示时刻设为
      // 「服务端采集时刻 + 对齐延迟」换算回本机时钟；否则退回固定延迟。
      establishTimeline(ptsUs) {
        if (this.mediaBaseUs !== null) return true;
        this.mediaBaseUs = ptsUs;
        const originServerMs = originByPath.get(this.streamPath);
        if (!syncInfoReady || (synchronizeEnabled && (serverOffsetMs === null || !Number.isFinite(originServerMs)))) {
          // 同步信息尚未完成时不要用本地到达时刻锁定起播点。等待下一个
          // 关键帧，避免多路连接分别以各自的网络到达时间开始播放。
          this.mediaBaseUs = null;
          return false;
        }
        if (synchronizeEnabled && serverOffsetMs !== null && Number.isFinite(originServerMs)) {
          const firstServerMs = originServerMs + this.mediaBaseUs / 1000;
          this.startPerfMs = firstServerMs + playbackLatencyMs() + this.adaptiveLatentMs - serverOffsetMs;
        } else {
          this.startPerfMs = performance.now() + playbackLatencyMs() + this.adaptiveLatentMs;
        }
        this.resetPresentationPhase();
        this.audioArrivalLeadMs = null;
        this.audioArrivalLeadObservedAt = 0;
        this.audioArrivalGroupAnchorUs = null;
        this.audioArrivalGroupIndex = null;
        this.audioArrivalGroupMinLeadMs = null;
        this.audioArrivalGroupMinLeadObservedAt = 0;
        this.adaptiveLatentDeficitSince = null;
        this.adaptiveLatentDeficitWindowMs = 0;
        // 音频配置往往会先于第一张关键帧到达。时间轴一旦建立，立即消费此前
        // 保留的压缩音频，而不是让这些输出在 mediaBaseUs 为 null 时被丢弃。
        this.resetAudioTimeline('timeline-established');
        this.pumpAudio();
        return true;
      }

      configureVideo(data) {
        const key = avccDescriptionKey(data);
        if (key === this.videoConfigKey && this.videoDecoder) return;
        this.videoConfig = data.slice();
        this.videoConfigKey = key;
        this.closeVideoDecoder();
        if (typeof VideoDecoder === 'undefined' || typeof EncodedVideoChunk === 'undefined') {
          this.setFatal('此浏览器不支持 WebCodecs 视频解码');
          return;
        }
        const generation = this.decoderGeneration;
        try {
          this.videoDecoder = new VideoDecoder({
            output: (frame) => {
              if (generation !== this.decoderGeneration) {
                frame.close();
                return;
              }
              this.decodedVideoFrames++;
              this.lastVideoOutputAt = performance.now();
              this.observeVideoDecodeLead(Number(frame.timestamp), this.lastVideoOutputAt);
              this.queueDecodedVideoFrame(frame);
              this.pumpVideo();
            },
            error: () => {
              if (generation !== this.decoderGeneration || this.fatal) return;
              setStatus('视频解码异常，等待下一个关键帧…', true);
              this.waitingForKeyframe = true;
              this.closeVideoDecoder();
            }
          });
          // 推流端关闭了 B 帧；低延迟模式让解码器逐帧立即输出，不再为可能
          // 的重排序扣留画面，解码到呈现少等一到两帧。
          this.videoDecoder.configure({
            codec: makeAvcCodec(this.videoConfig),
            description: this.videoConfig.slice().buffer,
            optimizeForLatency: true,
          });
          this.waitingForKeyframe = true;
        } catch (error) {
          this.setFatal('无法配置 H.264 解码器：' + error.message);
        }
      }

      // 只把显示时刻临近的压缩帧交给解码器。latent 很大时其余帧留在
      // videoInput，既不占用解码输出内存，也不会被短窗口裁剪逻辑误丢。
      pumpVideo() {
        if (!this.videoDecoder || this.fatal) return;
        const decodeUntilUs = this.mediaBaseUs !== null && this.startPerfMs !== null
          ? this.currentTargetUs() + VIDEO_DECODE_AHEAD_US
          : null;
        while (this.videoInput.length && this.videoDecoder.decodeQueueSize < 8) {
          const item = this.videoInput[0];
          if (decodeUntilUs !== null && item.timestampUs > decodeUntilUs) break;
          this.videoInput.shift();
          this.videoInputBytes -= item.data.byteLength;
          try {
            this.videoDecoder.decode(new EncodedVideoChunk({
              type: item.key ? 'key' : 'delta',
              timestamp: item.timestampUs,
              data: item.data
            }));
          } catch (_) {
            this.waitingForKeyframe = true;
            setStatus('视频帧已跳过，等待关键帧…', true);
            break;
          }
        }
      }

      enqueueVideo(timestampUs, key, data) {
        if (this.fatal || !data.length) return;
        this.observeSourceVideoRate(timestampUs);
        // 重连或网络追赶时,已经显示过的编码分片没有再送入解码器的价值。
        // 渲染队列还会继续丢弃已过播放时刻的解码帧,两层都限制旧数据堆积。
        if (this.lastDisplayedPtsUs !== null && timestampUs <= this.lastDisplayedPtsUs) {
          this.droppedFrames++;
          return;
        }

        // Low-latency playback should not cache a future GOP. Once playback
        // falls behind, keep only a keyframe boundary instead of decoding an
        // ever-growing backlog and displaying seconds-old frames.
        const targetUs = this.currentTargetUs();
        const maxAheadUs = Math.max(
          MAX_VIDEO_AHEAD_US,
          (playbackLatencyMs() + this.adaptiveLatentMs) * 2000,
        );
        if (targetUs !== null && timestampUs > targetUs + maxAheadUs) {
          if (!key) {
            this.droppedFrames++;
            return;
          }
          this.videoInput = [];
          this.videoInputBytes = 0;
          this.closeVideoDecoder();
          if (this.videoConfig) this.configureVideo(this.videoConfig);
          this.mediaBaseUs = null;
          this.startPerfMs = null;
          if (!this.establishTimeline(timestampUs)) {
            this.waitingForKeyframe = true;
            return;
          }
        }

        if (this.lastInputPtsUs !== null && timestampUs + 1000000 < this.lastInputPtsUs) {
          if (!key) return;
          this.closeVideoDecoder();
          if (this.videoConfig) this.configureVideo(this.videoConfig);
          this.mediaBaseUs = null;
          this.startPerfMs = null;
          this.lastInputPtsUs = timestampUs;
          this.waitingForKeyframe = true;
        }
        this.lastInputPtsUs = Math.max(this.lastInputPtsUs === null ? timestampUs : this.lastInputPtsUs, timestampUs);
        if (this.waitingForKeyframe && !key) return;
        if (key) {
          if (!this.establishTimeline(timestampUs)) return;
          this.waitingForKeyframe = false;
        }
        if (!this.videoDecoder && this.videoConfig) this.configureVideo(this.videoConfig);
        if (!this.videoDecoder) return;
        if (this.videoInput.length >= this.maxVideoInputFrames()
          || this.videoInputBytes + data.length > this.maxVideoInputBytes()) {
          if (!key) {
            this.droppedFrames++;
            return;
          }
          this.videoInput = [];
          this.videoInputBytes = 0;
          this.closeVideoDecoder();
          if (this.videoConfig) this.configureVideo(this.videoConfig);
        }
        this.videoInput.push({ timestampUs, key, data: data.slice() });
        this.videoInputBytes += data.byteLength;
        this.trimVideoInput();
        this.pumpVideo();
        setStatus('播放中');
      }

      // ---------- 音频输出：AudioContext + AudioWorklet FIFO ----------
      audioOutputReady() {
        return Boolean(this.audioContext
          && this.audioContext.state === 'running'
          && this.audioWorkletNode
          && this.audioWorkletReady
          && this.audioStretcher
          && this.mediaBaseUs !== null
          && this.startPerfMs !== null);
      }

      // 音频应当正在播放的媒体时间：视频时间轴按画面实际呈现的滞后修正后，
      // 再向后退 audiolatent。
      audioTargetUs(nowPerfMs = performance.now()) {
        return this.currentTargetUs(nowPerfMs - EXTRA_AUDIO_LATENT_MS - this.displayLagMs);
      }

      audioPerfTimeForMediaUs(mediaUs) {
        const videoPerfMs = this.perfTimeForMediaUs(mediaUs);
        return videoPerfMs === null ? null : videoPerfMs + EXTRA_AUDIO_LATENT_MS + this.displayLagMs;
      }

      // 仅公共时钟确认严重欠载并重新蓄水时才等待；普通预算变化由连续
      // WSOLA 控速吸收。等待保留已解码 PCM，不清空正在播放的流。
      delayAudioOutput(delayMs) {
        if (!this.audioOutputReady() || this.audioFifoQueuedFrames() <= 0) return;
        const frames = Math.round(delayMs / 1000 * this.audioSampleRate());
        if (frames <= 0) return;
        this.postAudioOutput({ type: 'hold', frames });
        this.audioHoldFramesRequested += frames;
        this.audioSyncFilteredErrorMs = null;
        this.audioSyncHardErrorSince = null;
      }

      // 向输出宿主（AudioWorklet 或 ScriptProcessorNode 回退）投递 FIFO 消息。
      postAudioOutput(message, transfer) {
        const node = this.audioWorkletNode;
        if (!node) return false;
        if (this.audioOutputKind === 'script') {
          node.livesuiteFifo.handleMessage(message);
          return true;
        }
        if (transfer) node.port.postMessage(message, transfer);
        else node.port.postMessage(message);
        return true;
      }

      releaseAudioOutputNode() {
        const node = this.audioWorkletNode;
        if (!node) return;
        try { if (node.port) node.port.onmessage = null; } catch (_) {}
        try { node.onprocessorerror = null; } catch (_) {}
        try { node.onaudioprocess = null; } catch (_) {}
        try { node.disconnect(); } catch (_) {}
        this.audioWorkletNode = null;
        this.audioWorkletReady = false;
        this.audioOutputKind = null;
      }

      destroyAudioOutput() {
        this.audioWorkletGeneration++;
        this.audioWorkletPromise = null;
        this.releaseAudioOutputNode();
        this.audioStretcher = null;
        if (this.audioContext) {
          const context = this.audioContext;
          this.audioContext = null;
          context.onstatechange = null;
          void context.close().catch(() => {});
        }
        this.audioContextSampleRate = 0;
        this.audioFifoStatus = null;
        this.audioFifoStatusHistory = [];
        this.audioFifoAssumeEmpty = true;
        this.audioFifoPushedFrames = 0;
        this.audioFifoChunks = [];
        this.audioFlushesRequested = 0;
        this.audioHoldFramesRequested = 0;
        this.audioPushedSinceStatus = 0;
      }

      // AudioContext 按 AAC 采样率创建：FIFO 输出无需再经过一次重采样，
      // 采样率不同的新配置只在音频重配时重建上下文。声音默认自动开始；若
      // 浏览器的自动播放策略拒绝，则在任意用户交互后静默恢复。
      ensureAudioOutput() {
        if (!this.audioConfig) return;
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return;
        const desiredRate = this.audioConfig.sampleRate;
        if (this.audioContext && this.audioContext.state !== 'closed'
          && this.audioContextSampleRate === desiredRate) {
          if (!this.audioWorkletNode) this.createAudioWorkletNode();
          return;
        }
        this.destroyAudioOutput();
        let context = null;
        try {
          context = new Context({ latencyHint: 'interactive', sampleRate: desiredRate });
        } catch (_) {
          try { context = new Context({ latencyHint: 'interactive' }); } catch (__) { context = null; }
        }
        if (!context) return;
        this.audioContextSampleRate = desiredRate;
        context.onstatechange = () => {
          if (this.audioContext !== context) return;
          if (context.state === 'running') {
            // 挂起期间 FIFO 停摆，已排队的声音全部迟到：从当前时刻重新起播。
            this.resetAudioTimeline('context-resumed');
            this.pumpAudio();
          } else if (context.state === 'suspended') {
            this.ensureAudioContextRunning();
          }
          refreshAudioUnlockVisibility();
        };
        if ('onsinkchange' in context) {
          context.onsinkchange = () => {
            if (this.audioContext === context && context.state === 'running') {
              this.resetAudioTimeline('sink-changed');
            }
          };
        }
        this.audioContext = context;
        this.audioWorkletReady = false;
        this.createAudioWorkletNode();
        this.ensureAudioContextRunning();
        refreshAudioUnlockVisibility();
      }

      // 输出节点建好后的公共初始化：伸缩器与 FIFO 记账从零开始。
      attachAudioOutputNode(node, kind, channels) {
        const context = this.audioContext;
        this.audioWorkletNode = node;
        this.audioWorkletReady = true;
        this.audioOutputKind = kind;
        this.audioStretcher = new AudioTimeStretcher(channels, context.sampleRate);
        this.audioStretcher.setRate(this.audioStretchRate);
        this.audioFifoAssumeEmpty = true;
        this.audioFlushesRequested = 0;
        this.audioHoldFramesRequested = 0;
        this.audioFifoPushedFrames = 0;
        this.audioFifoChunks = [];
        this.audioFifoStatus = null;
        this.audioFirstPushAt = 0;
        this.audioFifoStatusHistory = [];
        this.audioOutputWaitStartedAt = performance.now();
        this.audioStartFresh = true;
        this.audioFreshAppend = true;
        this.pumpAudio();
        refreshAudioUnlockVisibility();
      }

      // ScriptProcessorNode 回退：同一个 FIFO 类跑在主线程上，缓冲 1024 帧。
      createScriptProcessorOutput(reason) {
        const context = this.audioContext;
        if (!context || this.audioWorkletNode) return false;
        if (typeof context.createScriptProcessor !== 'function') {
          setStatus('此浏览器既不支持 AudioWorklet 也不支持 ScriptProcessorNode，无法输出音频', true);
          return false;
        }
        const channels = clampNumber(this.audioConfig?.channels || 2, 1, 8);
        let node;
        let fifo;
        try {
          node = context.createScriptProcessor(AUDIO_SCRIPT_PROCESSOR_BUFFER_FRAMES, 1, channels);
          fifo = createMainThreadAudioFifo((message) => {
            if (this.audioWorkletNode === node) this.handleAudioFifoStatus(message);
          });
          node.livesuiteFifo = fifo;
          node.onaudioprocess = (event) => {
            fifo.hostTime = event.playbackTime;
            const outputs = [];
            for (let channel = 0; channel < event.outputBuffer.numberOfChannels; channel++) {
              outputs.push(event.outputBuffer.getChannelData(channel));
            }
            fifo.process([], [outputs]);
          };
          node.connect(context.destination);
        } catch (error) {
          this.audioScheduleErrors++;
          this.lastAudioScheduleError = error instanceof Error ? error.message : String(error);
          this.lastAudioScheduleErrorAt = performance.now();
          setStatus('音频输出回退初始化失败：' + this.lastAudioScheduleError, true);
          return false;
        }
        this.audioOutputFallbacks++;
        this.lastAudioOutputFallbackReason = reason;
        setStatus('音频输出改用 ScriptProcessorNode（' + reason + '）', true);
        this.attachAudioOutputNode(node, 'script', channels);
        return true;
      }

      // 放弃当前的 AudioWorklet 输出，改用回退宿主；FIFO 从头开始。
      switchAudioOutputToScriptProcessor(reason) {
        if (this.audioOutputKind === 'script') return;
        this.audioWorkletGeneration++;
        this.audioWorkletPromise = null;
        this.releaseAudioOutputNode();
        if (this.createScriptProcessorOutput(reason)) {
          this.resetAudioTimeline('output-fallback');
          this.pumpAudio();
        }
      }

      createAudioWorkletNode() {
        const context = this.audioContext;
        if (!context || this.audioWorkletNode || this.audioWorkletPromise) return;
        if (forcedAudioOutput === 'script') {
          this.createScriptProcessorOutput('forced');
          return;
        }
        if (!context.audioWorklet || typeof AudioWorkletNode === 'undefined') {
          this.createScriptProcessorOutput('no-audioworklet');
          return;
        }
        const generation = ++this.audioWorkletGeneration;
        const url = URL.createObjectURL(new Blob([AUDIO_WORKLET_SOURCE], { type: 'application/javascript' }));
        this.audioWorkletPromise = context.audioWorklet.addModule(url)
          .then(() => {
            if (this.audioContext !== context || generation !== this.audioWorkletGeneration) return;
            const channels = clampNumber(this.audioConfig?.channels || 2, 1, 8);
            const node = new AudioWorkletNode(context, AUDIO_WORKLET_PROCESSOR_NAME, {
              numberOfInputs: 0,
              numberOfOutputs: 1,
              outputChannelCount: [channels],
            });
            node.port.onmessage = (event) => {
              if (this.audioWorkletNode === node) this.handleAudioFifoStatus(event.data);
            };
            node.onprocessorerror = () => {
              if (this.audioWorkletNode === node) this.switchAudioOutputToScriptProcessor('processor-error');
            };
            node.connect(context.destination);
            this.attachAudioOutputNode(node, 'worklet', channels);
          })
          .catch((error) => {
            this.audioScheduleErrors++;
            this.lastAudioScheduleError = error instanceof Error ? error.message : String(error);
            this.lastAudioScheduleErrorAt = performance.now();
            setStatus('AudioWorklet 加载失败，改用回退输出：' + this.lastAudioScheduleError, true);
            if (this.audioContext === context && generation === this.audioWorkletGeneration) {
              this.createScriptProcessorOutput('module-load-failed');
            }
          })
          .finally(() => {
            URL.revokeObjectURL(url);
            if (generation === this.audioWorkletGeneration) this.audioWorkletPromise = null;
          });
      }

      configureAudio() {
        if (!this.audioConfig || this.audioDecoder || typeof AudioDecoder === 'undefined') return;
        if (typeof EncodedAudioChunk === 'undefined') return;
        this.ensureAudioOutput();
        if (!this.audioContext) return;
        const nowPerfMs = performance.now();
        this.audioDecoderGraceUntil = Math.max(
          this.audioDecoderGraceUntil,
          nowPerfMs + this.audioDecoderStallThresholdMs(),
        );
        const generation = this.audioDecoderGeneration;
        try {
          this.audioDecoder = new AudioDecoder({
            output: (audioData) => {
              if (generation !== this.audioDecoderGeneration) {
                audioData.close();
                return;
              }
              this.lastAudioOutputAt = performance.now();
              this.oldestPendingAudioSubmitAt = 0;
              this.audioDecodeOutputs++;
              // 解码输出与提交的压缩块按顺序一一对应（AAC 每个访问单元恰好输出
              // 一块）。Chromium 的 AudioDecoder 从首块时间戳按样本数累加生成
              // 输出时间戳、忽略后续输入的时间戳跳变，源音频每出现一次空洞，
              // 输出时间戳就永久落后一段；因此媒体时间一律取提交时记录的 FLV
              // 时间戳，AudioData.timestamp 只留作诊断。
              const submitted = this.takeAudioDecodeSubmission();
              let mediaTimestampUs = audioData.timestamp;
              if (submitted) {
                mediaTimestampUs = submitted.timestampUs;
                this.observeAudioDecodeLatency(this.lastAudioOutputAt - submitted.at);
                this.audioDecodeTimestampOffsetUs = submitted.timestampUs - audioData.timestamp;
              }
              this.audioDecoderGraceUntil = 0;
              this.appendDecodedAudio(audioData, mediaTimestampUs);
              // 解码器输出会降低 decodeQueueSize；继续泵送能够让积压的有效
              // AAC 在同一轮里排完，而不必等待下一包网络音频来触发。
              this.pumpAudio();
            },
            error: () => {
              if (generation !== this.audioDecoderGeneration || this.fatal) return;
              setStatus('音频解码不可用，视频仍可继续播放');
              this.closeAudioDecoderInstance();
            }
          });
          this.audioDecoder.configure({
            codec: this.audioConfig.codec,
            description: this.audioConfig.data.slice().buffer,
            sampleRate: this.audioConfig.sampleRate,
            numberOfChannels: this.audioConfig.channels
          });
        } catch (_) {
          this.closeAudioDecoderInstance();
          setStatus('音频解码不可用，视频仍可继续播放');
        }
      }

      // 只把播放时刻临近的压缩块交给解码器；audiolatent 期间其余块留在
      // audioInput。重新起播只清理已错过播放点的块，不能反复裁掉仍在未来的
      // 音频；严重迟到的孤立 PCM 块直接跳过。
      pumpAudio() {
        if (this.audioPendingPcm?.length) this.drainPendingAudioPcm();
        if (!this.audioDecoder || this.fatal || !this.audioOutputReady()) return;
        // AudioContext 标记 running 后，设备/首个 worklet 量子仍可能晚启动
        // 数百毫秒。先确认输出时钟已经前进，再选择第一次出声的媒体位置。
        if (!this.audioFifoStatus) return;
        const outputStamp = audioOutputStamp(this.audioContext);
        if (typeof this.audioContext.getOutputTimestamp === 'function'
          && !outputStamp
          && this.audioContext.currentTime * 1000 < AUDIO_OUTPUT_CLOCK_WARMUP_MS) return;
        const nowPerfMs = performance.now();
        const audioTargetUs = this.audioTargetUs(nowPerfMs);
        const firstOutputPerfMs = outputStamp
          ? outputStamp.performanceTime + (this.audioContext.currentTime
            + AUDIO_FIFO_PRIME_LEAD_SECONDS - outputStamp.contextTime) * 1000
          : nowPerfMs + (audioOutputLatencySeconds(this.audioContext)
            + AUDIO_FIFO_PRIME_LEAD_SECONDS) * 1000;
        const before = this.audioInput.length;
        this.audioInput = this.audioStartFresh
          ? retainFreshAudioInput(
            this.audioInput,
            this.audioTargetUs(firstOutputPerfMs),
          )
          : retainSchedulableAudioInput(this.audioInput, audioTargetUs);
        if (this.audioInput.length !== before && this.audioStreamBaseUs !== null) {
          this.audioLateSkips += before - this.audioInput.length;
          this.audioStreamRestartPending = true;
        }
        const decodeUntilUs = audioTargetUs + AUDIO_DECODE_AHEAD_MS * 1000;
        while (this.audioInput.length && this.audioDecoder.decodeQueueSize < 8) {
          const item = this.audioInput[0];
          if (item.timestampUs > decodeUntilUs) break;
          this.audioInput.shift();
          try {
            this.audioDecoder.decode(new EncodedAudioChunk({
              type: 'key', timestamp: item.timestampUs, data: item.data
            }));
            this.lastAudioDecodeSubmitAt = nowPerfMs;
            this.audioStartFresh = false;
            if (this.oldestPendingAudioSubmitAt === 0) this.oldestPendingAudioSubmitAt = nowPerfMs;
            // 记录提交顺序与时间戳：输出块的媒体时间由此配对得到。
            this.audioDecodeSubmitQueue.push({ timestampUs: item.timestampUs, at: nowPerfMs });
            if (this.audioDecodeSubmitQueue.length > 64) this.audioDecodeSubmitQueue.shift();
            this.audioDecodeSubmitted++;
          } catch (_) {
            this.audioInput = [];
            break;
          }
        }
      }

      appendDecodedAudio(audioData, mediaTimestampUs = audioData.timestamp) {
        try {
          if (!this.audioOutputReady()) return;
          const timestampUs = Number.isFinite(mediaTimestampUs)
            ? mediaTimestampUs
            : (this.audioStreamExpectedUs ?? this.mediaBaseUs);
          const frames = audioData.numberOfFrames;
          if (!frames) return;
          const channels = Math.min(audioData.numberOfChannels, 8);
          let planes = [];
          for (let channel = 0; channel < channels; channel++) {
            const samples = new Float32Array(frames);
            audioData.copyTo(samples, { planeIndex: channel, format: 'f32-planar' });
            planes.push(samples);
          }
          const contextRate = this.audioSampleRate();
          if (audioData.sampleRate !== contextRate) {
            if (!this.audioResampler || this.audioResampler.inputRate !== audioData.sampleRate) {
              this.audioResampler = new LinearResampler(channels, audioData.sampleRate, contextRate);
              this.audioResampler.inputRate = audioData.sampleRate;
            }
            planes = this.audioResampler.process(planes);
          }
          this.appendAudioStream(timestampUs, planes);
        } catch (error) {
          this.audioScheduleErrors++;
          this.lastAudioScheduleError = error instanceof Error ? error.message : String(error);
          this.lastAudioScheduleErrorAt = performance.now();
          // 单个 PCM 块转换失败只丢该块；不要把局部错误扩大成音视频重连。
        } finally {
          audioData.close();
        }
      }

      // 从指定时间戳重新起播 PCM 流。只重置拼装与伸缩状态并标记不连续；FIFO
      // 里已排队的有效声音继续播完，新流按自己应当出声的时刻接上。
      startAudioStream(timestampUs) {
        if (this.audioStreamBaseUs !== null) this.audioStreamRestarts++;
        this.audioStretcher.reset();
        this.audioStretcher.setRate(this.audioStretchRate);
        this.audioStreamBaseUs = timestampUs;
        this.audioStreamExpectedUs = timestampUs;
        this.audioStreamRestartPending = false;
        this.audioStreamDiscontinuity = true;
      }

      // PCM 流装配：采样数决定连续波形，时间戳用于确认丢帧/重新对时。
      // Android 的一次采集会拆成多个 AAC 帧；采集时钟波动不能直接触发
      // 裁样本/补静音，否则一个偏早的标签会造成先裁切、下一包再补洞。
      appendAudioStream(timestampUs, planes) {
        if (this.audioStreamBaseUs === null || this.audioStreamRestartPending) {
          this.audioPendingPcm = [];
          this.audioPendingPcmFrames = 0;
          this.startAudioStream(timestampUs);
        }
        const frames = planes[0].length;
        this.audioPendingPcm.push({ timestampUs, planes, frames, at: performance.now() });
        this.audioPendingPcmFrames += frames;
        this.drainPendingAudioPcm();
      }

      drainPendingAudioPcm() {
        const pending = this.audioPendingPcm;
        const sampleRate = this.audioSampleRate();
        while (pending.length) {
          const first = pending[0];
          const gapUs = first.timestampUs - this.audioStreamExpectedUs;
          let correctionUs = 0;
          if (Math.abs(gapUs) > AUDIO_CONTIGUITY_TOLERANCE_US) {
            let spanUs = 0;
            const errors = [];
            let recovered = false;
            for (const block of pending) {
              const errorUs = block.timestampUs - (this.audioStreamExpectedUs + spanUs);
              errors.push(errorUs);
              if (Math.abs(errorUs) <= AUDIO_CONTIGUITY_TOLERANCE_US) recovered = true;
              if (block !== pending[pending.length - 1]) spanUs += block.frames / sampleRate * 1e6;
            }
            const enoughEvidence = pending.length >= AUDIO_TIMESTAMP_PENDING_LIMIT
              || spanUs + 1 >= this.audioTimestampLookaheadMs(first.frames, sampleRate) * 1000;
            const expired = performance.now() - first.at >= Math.max(100,
              this.audioArrivalCadenceMs(first.frames, sampleRate) * 2);
            if (!recovered && !enoughEvidence && !expired) break;
            // 断流时仍释放末尾有效 PCM。若时间差已覆盖完整 AAC 帧，即使
            // 后续包不再到达也保留明确的丢帧/重复时长；小差值不做硬裁切。
            const wholeFrameStep = Math.abs(gapUs)
              >= first.frames / sampleRate * 1e6 - AUDIO_CONTIGUITY_TOLERANCE_US;
            if (!recovered && (enoughEvidence || (expired && wholeFrameStep))) {
              errors.sort((left, right) => left - right);
              const medianUs = errors[Math.floor(errors.length / 2)];
              if (Math.sign(medianUs) === Math.sign(gapUs)) correctionUs = medianUs;
            }
            const minimumGapUs = Math.max(AUDIO_CONTIGUITY_TOLERANCE_US,
              first.frames / sampleRate * 1e6 * 0.5);
            if (Math.abs(correctionUs) < minimumGapUs) {
              // 小而持续的采集时钟漂移交给已有的平滑音画同步闭环；只修正
              // 后续 PCM 的媒体标记，不删除或插入任何声音采样。
              this.audioStreamBaseUs += correctionUs;
              this.audioStreamExpectedUs += correctionUs;
              correctionUs = 0;
              this.audioTimestampJitterBlocks++;
            }
          }
          pending.shift();
          this.audioPendingPcmFrames -= first.frames;
          this.appendConfirmedAudioStream(this.audioStreamExpectedUs + correctionUs, first.planes);
          this.lastAudioPtsUs = first.timestampUs;
          if (this.audioStreamRestartPending) break;
        }
      }

      // 仅对跨采集组确认后的时间缺口执行补洞/去重，真实 AAC 丢帧仍保留
      // 原来的媒体时长；相邻 PCM 的小幅时间戳抖动已在上层消除。
      appendConfirmedAudioStream(timestampUs, planes) {
        const stretcher = this.audioStretcher;
        const sampleRate = this.audioSampleRate();
        let frames = planes[0].length;
        if (this.audioStreamBaseUs === null || this.audioStreamRestartPending) {
          this.startAudioStream(timestampUs);
        }
        const gapUs = timestampUs - this.audioStreamExpectedUs;
        if (gapUs < -AUDIO_CONTIGUITY_TOLERANCE_US) {
          const overlapFrames = Math.round(-gapUs * sampleRate / 1000000);
          this.audioOverlapDrops++;
          if (overlapFrames >= frames) return;
          planes = planes.map((plane) => plane.subarray(overlapFrames));
          frames -= overlapFrames;
        } else if (gapUs > AUDIO_CONTIGUITY_TOLERANCE_US) {
          if (gapUs > MAX_AUDIO_HOLE_US) {
            this.startAudioStream(timestampUs);
          } else {
            const holeFrames = Math.round(gapUs * sampleRate / 1000000);
            if (!stretcher.pushSilence(holeFrames)) {
              this.startAudioStream(timestampUs);
            } else {
              this.audioHolesUs += gapUs;
            }
          }
        }
        if (!stretcher.pushInput(planes)) {
          // 输入长期得不到消费（例如输出被挂起）：丢掉旧流从当前块重新开始。
          this.startAudioStream(timestampUs);
          stretcher.pushInput(planes);
        }
        this.audioStreamExpectedUs = this.audioStreamBaseUs
          + stretcher.inputWritten / sampleRate * 1000000;
        this.lastAudioPtsUs = timestampUs;
        this.drainAudioStretcher();
      }

      drainAudioStretcher() {
        const stretcher = this.audioStretcher;
        if (!stretcher || !this.audioOutputReady()) return;
        for (let iteration = 0; iteration < 64; iteration++) {
          const outputIndex = stretcher.outputWritten;
          const planes = stretcher.process();
          if (!planes) break;
          this.enqueueAudioOutput(planes, outputIndex);
          if (this.audioStreamRestartPending) break;
          if (planes[0].length < stretcher.outputCapacity) break;
        }
      }

      audioFifoIsEmpty() {
        return this.audioFifoAssumeEmpty
          || this.audioFifoQueuedFrames() < this.audioSampleRate() * 0.004;
      }

      // AAC 媒体归组只看一次采集覆盖的媒体时长；旧发送端退回当前解码块或
      // AAC 帧的真实时长。
      audioMediaGroupDurationMs(frames, sampleRate) {
        const streamLatency = serverLatencyByPath.get(this.streamPath);
        const groupMs = Number.isFinite(streamLatency?.audioGroupDurationMs)
          ? Math.max(0, streamLatency.audioGroupDurationMs)
          : 0;
        const decodedBlockMs = Number.isFinite(frames) && Number.isFinite(sampleRate)
          && frames > 0 && sampleRate > 0
          ? frames / sampleRate * 1000
          : 0;
        const encodedBlockMs = Number.isFinite(this.audioConfig?.sampleRate)
          && this.audioConfig.sampleRate > 0
          ? 1024 / this.audioConfig.sampleRate * 1000
          : 0;
        return Math.max(groupMs, decodedBlockMs, encodedBlockMs);
      }

      // 判断持续迟到及保留恢复队列所用的时间尺度取网络到达组间隔与媒体采集
      // 组时长的较大者，全部来自当前流的实测或格式信息。
      audioArrivalCadenceMs(frames, sampleRate) {
        const streamLatency = serverLatencyByPath.get(this.streamPath);
        const arrivalMs = Number.isFinite(streamLatency?.audioArrivalCadenceP95Ms)
          ? Math.max(0, streamLatency.audioArrivalCadenceP95Ms)
          : 0;
        return Math.max(arrivalMs, this.audioMediaGroupDurationMs(frames, sampleRate));
      }

      enqueueAudioOutput(planes, outputIndex) {
        const node = this.audioWorkletNode;
        const context = this.audioContext;
        const stretcher = this.audioStretcher;
        const sampleRate = this.audioSampleRate();
        let frames = planes[0].length;
        if (!node || !context || !frames) return;
        const inputIndex = stretcher.inputPositionForOutput(outputIndex);
        let mediaUs = inputIndex === null
          ? null
          : this.audioStreamBaseUs + inputIndex / sampleRate * 1000000;
        const fifoEmpty = this.audioFifoIsEmpty();
        const queueEndContextTime = fifoEmpty
          ? context.currentTime + AUDIO_FIFO_PRIME_LEAD_SECONDS
          : context.currentTime + this.audioFifoQueuedFrames() / sampleRate;
        const planForCurrentTimeline = () => {
          const desiredPerfMs = mediaUs === null ? null : this.audioPerfTimeForMediaUs(mediaUs);
          const desiredContextTime = desiredPerfMs === null
            ? null
            : audioContextTimeForPerformance(context, desiredPerfMs);
          return audioEnqueuePlan({
            fifoEmpty,
            discontinuity: this.audioStreamDiscontinuity,
            desiredContextTime,
            queueEndContextTime,
          });
        };
        let plan = planForCurrentTimeline();
        // 首次解码本身也可能晚回调。第一段声音尚未排队时，只裁去已经错过
        // 出声点的前缀，不把启动耗时变成几十秒的加速追赶；开始连续输出后
        // 不走此分支，已有 PCM 始终首尾相接。
        if (this.audioFreshAppend && this.audioFifoChunks.length === 0 && plan.lateSeconds > 0) {
          const trimFrames = Math.min(frames, Math.ceil(plan.lateSeconds * sampleRate / stretcher.rate));
          if (trimFrames >= frames) return;
          planes = planes.map((plane) => plane.slice(trimFrames));
          frames -= trimFrames;
          if (mediaUs !== null) mediaUs += trimFrames * stretcher.rate / sampleRate * 1000000;
          plan = planForCurrentTimeline();
        }
        const initialLateSeconds = plan.lateSeconds;
        const nowPerfMs = performance.now();
        const sourceCadenceMs = this.audioArrivalCadenceMs(frames, sampleRate);
        if (initialLateSeconds > 0) {
          this.audioCatchUps++;
          this.audioCatchUpMs += initialLateSeconds * 1000;
          const measuredLateMs = initialLateSeconds * 1000;
          if (this.audioFreshAppend && plan.action !== 'skip') {
            // 保留旧单播放器的首块锚定：音频稳定晚到数百毫秒时，第一块直接
            // 把音视频时基后移到可播放位置。严重迟到块不走这条路径；它更可能
            // 是偶发积压，直接丢弃的代价远低于重建所有流的时间轴。
            if (this.shiftAdaptiveLatent(
              measuredLateMs + sourceCadenceMs,
              nowPerfMs,
            ) > 0) {
              plan = planForCurrentTimeline();
            }
          }
        }
        if (plan.action === 'skip') {
          // 严重迟到只丢对应块，不在 PCM 回调里重建时间轴。若整体到达基线
          // 确实改变，由压缩音频的真实采集组窗口统一增加 adaptiveLatent。
          this.audioLateSkips++;
          this.audioStreamRestartPending = true;
          this.audioStartFresh = true;
          this.audioFreshAppend = true;
          this.audioInput = retainFreshAudioInput(
            this.audioInput,
            this.audioTargetUs(nowPerfMs),
            sourceCadenceMs,
          );
          return;
        }
        try {
          if (plan.action === 'pad') {
            const padFrames = Math.round(plan.padSeconds * sampleRate);
            if (padFrames > 0) {
              this.postAudioOutput({ type: 'push', frames: padFrames });
              this.audioFifoPushedFrames += padFrames;
              this.audioPushedSinceStatus += padFrames;
              this.audioPrimes++;
            }
          }
          this.audioFifoChunks.push({
            fifoStart: this.audioFifoPushedFrames,
            frames,
            mediaUs,
            rate: stretcher.rate,
          });
          if (this.audioFifoChunks.length > 512) {
            this.audioFifoChunks.splice(0, this.audioFifoChunks.length - 384);
          }
          this.postAudioOutput(
            { type: 'push', planes, frames },
            this.audioOutputKind === 'script' ? null : planes.map((plane) => plane.buffer),
          );
          if (this.audioFirstPushAt === 0) this.audioFirstPushAt = performance.now();
          this.audioFifoPushedFrames += frames;
          this.audioPushedSinceStatus += frames;
          this.audioFifoAssumeEmpty = false;
          this.audioStreamDiscontinuity = false;
          this.audioFreshAppend = false;
        } catch (error) {
          this.audioScheduleErrors++;
          this.lastAudioScheduleError = error instanceof Error ? error.message : String(error);
          this.lastAudioScheduleErrorAt = performance.now();
        }
      }

      // FIFO 序号（含静音填充）换算为媒体时间；落在填充段内返回 null。块内
      // 按该块生成时的伸缩比线性推算，块长仅一二十毫秒，误差可忽略；映射
      // 不依赖伸缩器的内部序号，流重新起播后旧块仍能正确换算。
      audioMediaUsForFifo(fifoIndex) {
        const chunks = this.audioFifoChunks;
        if (!chunks.length || !Number.isFinite(fifoIndex)) return null;
        let low = 0;
        let high = chunks.length - 1;
        while (low < high) {
          const middle = (low + high + 1) >> 1;
          if (chunks[middle].fifoStart <= fifoIndex) low = middle;
          else high = middle - 1;
        }
        const chunk = chunks[low];
        if (fifoIndex < chunk.fifoStart || fifoIndex >= chunk.fifoStart + chunk.frames
          || !Number.isFinite(chunk.mediaUs)) {
          return null;
        }
        return chunk.mediaUs
          + (fifoIndex - chunk.fifoStart) / this.audioSampleRate() * chunk.rate * 1000000;
      }

      handleAudioFifoStatus(status) {
        if (!status || status.type !== 'status') return;
        // 旧一轮（flush 之前）的状态不能用于当前时间轴。
        if (status.flushes !== this.audioFlushesRequested) return;
        this.audioFifoStatus = status;
        this.audioFifoStatusHistory.push(status);
        if (this.audioFifoStatusHistory.length > AUDIO_SYNC_STATUS_HISTORY_LIMIT) {
          this.audioFifoStatusHistory.shift();
        }
        this.audioFifoStatusAt = performance.now();
        this.audioFifoAssumeEmpty = false;
        this.audioPushedSinceStatus = Math.max(
          0,
          this.audioFifoPushedFrames - status.consumedFrames - status.queuedFrames,
        );
        this.audioUnderruns = status.underruns;
        this.audioUnderrunFrames = status.underrunFrames;
        this.updateAudioSync(status);
        this.pumpAudio();
      }

      // 本地音画同步：把“此刻正从声卡出声的采样”换算成媒体时间，与视频
      // 时间轴比较，用极小的伸缩比把音频锁在画面上。缺数据期间误差无意义，
      // 起播和追赶由入队策略处理；偏差过大时丢弃队列重新起播。
      updateAudioSync(status) {
        const context = this.audioContext;
        if (!this.audioOutputReady() || this.audioStreamBaseUs === null) return;
        if (status.holdFrames > 0
          || this.audioHoldFramesRequested > (status.holdFramesRequested || 0)) return;
        const sampleRate = this.audioSampleRate();
        const nowPerfMs = performance.now();
        const stamp = audioOutputStamp(context);
        const heardContextTime = stamp
          ? stamp.contextTime + (nowPerfMs - stamp.performanceTime) / 1000
          : context.currentTime - audioOutputLatencySeconds(context);
        const heardStatus = audioStatusForContextTime(this.audioFifoStatusHistory, heardContextTime);
        const fifoIndex = audioRenderedOutputFrame({
          status: heardStatus,
          appendedFrames: this.audioFifoPushedFrames,
          contextTimeNow: heardContextTime,
          sampleRate,
        });
        const heardMediaUs = fifoIndex === null ? null : this.audioMediaUsForFifo(fifoIndex);
        if (heardMediaUs === null) return;
        const errorMs = (heardMediaUs - this.audioTargetUs(nowPerfMs)) / 1000;
        this.audioSyncErrorMs = errorMs;
        this.audioSyncUpdates++;
        if (status.starving || heardStatus.starving || heardStatus.holdFrames > 0) return;
        this.lastHeardAudioPtsUs = heardMediaUs;
        const elapsedMs = this.audioSyncUpdatedAt > 0
          ? clampNumber(nowPerfMs - this.audioSyncUpdatedAt, 0, 250) : 20;
        this.audioSyncUpdatedAt = nowPerfMs;
        this.audioSyncFilteredErrorMs = this.audioSyncFilteredErrorMs === null ? errorMs
          : this.audioSyncFilteredErrorMs + (errorMs - this.audioSyncFilteredErrorMs)
            * (1 - Math.exp(-elapsedMs / AUDIO_SYNC_FILTER_MS));
        if (Math.abs(errorMs) > AUDIO_SYNC_HARD_RESYNC_MS) {
          if (this.audioSyncHardErrorSince === null) this.audioSyncHardErrorSince = nowPerfMs;
          if (nowPerfMs - this.audioSyncHardErrorSince >= 300) {
            this.audioHardResyncs++;
            this.lastAudioHardResyncAt = nowPerfMs;
            this.resetAudioTimeline('sync-error');
            return;
          }
        } else {
          this.audioSyncHardErrorSince = null;
        }
        const reserveMs = this.audioFifoQueuedFrames() / sampleRate * 1000;
        this.audioSyncDeviation = audioSyncDeviationStep({
          errorMs: this.audioSyncFilteredErrorMs,
          deviation: this.audioSyncDeviation,
          allowFaster: reserveMs >= AUDIO_SYNC_MIN_RESERVE_MS,
          elapsedMs,
        });
        this.updateAudioStretchRate();
      }

      // 输出宿主健康：按本轮首块和最近有效状态检测停滞，正常 flush 会开始
      // 新的等待窗口；真正停止回报的 worklet 改用回退宿主。另外在
      // 音频长期无输出时定期打印诊断，便于定位环境问题。
      watchAudioOutputHealth(nowPerfMs = performance.now()) {
        const context = this.audioContext;
        if (!context || !this.audioConfig) return;
        if (this.audioOutputKind === 'worklet' && context.state === 'running'
          && (this.audioFirstPushAt > 0 || this.audioOutputWaitStartedAt > 0)
          && nowPerfMs - Math.max(this.audioFirstPushAt, this.audioFifoStatusAt,
            this.audioOutputWaitStartedAt)
            > AUDIO_FALLBACK_STATUS_TIMEOUT_MS) {
          this.switchAudioOutputToScriptProcessor('worklet-silent');
          return;
        }
        const consumed = this.audioFifoStatus ? this.audioFifoStatus.consumedFrames : 0;
        if (consumed !== this.lastReportedConsumedFrames) {
          this.lastReportedConsumedFrames = consumed;
          this.audioSilentSince = 0;
          return;
        }
        if (this.audioSilentSince === 0) {
          this.audioSilentSince = nowPerfMs;
          return;
        }
        if (nowPerfMs - this.audioSilentSince < AUDIO_SILENCE_REPORT_INTERVAL_MS) return;
        if (this.lastAudioSilenceReportAt > 0
          && nowPerfMs - this.lastAudioSilenceReportAt < AUDIO_SILENCE_REPORT_INTERVAL_MS) return;
        this.lastAudioSilenceReportAt = nowPerfMs;
        const diagnostics = this.audioDiagnostics();
        console.warn('[LiveSuite] 音频持续无输出', JSON.stringify({
          build: PLAYER_BUILD_ID,
          contextState: diagnostics.contextState,
          contextSampleRate: diagnostics.contextSampleRate,
          output: this.audioOutputKind,
          workletReady: diagnostics.workletReady,
          fallbacks: this.audioOutputFallbacks,
          lastFallback: this.lastAudioOutputFallbackReason,
          compressedBlocks: diagnostics.compressedBlocks,
          decodeSubmitted: diagnostics.decodeSubmitted,
          decodeOutputs: diagnostics.decodeOutputs,
          fifoQueuedMs: Math.round(diagnostics.fifoQueuedMs),
          pushedFrames: this.audioFifoPushedFrames,
          consumedFrames: consumed,
          arrivalLeadMs: diagnostics.arrivalLeadMs === null ? null : Math.round(diagnostics.arrivalLeadMs),
          adaptiveLatentMs: Math.round(diagnostics.adaptiveLatentMs),
          lateSkips: diagnostics.lateSkips,
          hardResyncs: diagnostics.hardResyncs,
          lastHardResync: diagnostics.lastHardResyncReason,
          scheduleErrors: diagnostics.scheduleErrors,
          lastError: diagnostics.lastScheduleError,
          timeline: this.mediaBaseUs !== null && this.startPerfMs !== null,
        }));
      }

      recoverAudioSyncHealth(nowPerfMs = performance.now()) {
        if (!this.audioOutputReady()) return null;
        // FIFO 里排着远超延迟预算的声音，说明视频时间轴停摆或换算异常。
        const maximumSeconds = 2
          + (playbackLatencyMs() + this.adaptiveLatentMs + EXTRA_AUDIO_LATENT_MS) / 1000;
        if (this.audioFifoQueuedFrames() / this.audioSampleRate() > maximumSeconds) {
          this.audioHardResyncs++;
          this.lastAudioHardResyncAt = nowPerfMs;
          this.resetAudioTimeline('future-backlog');
          if (this.lastAudioRecoveryStatusAt === 0
            || nowPerfMs - this.lastAudioRecoveryStatusAt >= AUDIO_RECOVERY_STATUS_INTERVAL_MS) {
            setStatus('音频队列异常积压，正在重新起播…', true);
            this.lastAudioRecoveryStatusAt = nowPerfMs;
          }
          return 'future-backlog';
        }
        return null;
      }

      audioDiagnostics() {
        const context = this.audioContext;
        const stretcher = this.audioStretcher;
        return {
          contextState: context ? context.state : null,
          contextSampleRate: context ? context.sampleRate : null,
          outputLatencyMs: context ? audioOutputLatencySeconds(context) * 1000 : null,
          workletReady: this.audioWorkletReady,
          fifoQueuedMs: this.audioFifoQueuedFrames() / this.audioSampleRate() * 1000,
          stretcherInputMs: stretcher ? stretcher.bufferedInputFrames() / this.audioSampleRate() * 1000 : 0,
          compressedBlocks: this.audioInput.length,
          syncErrorMs: this.audioSyncErrorMs,
          filteredSyncErrorMs: this.audioSyncFilteredErrorMs,
          syncDeviation: this.audioSyncDeviation,
          stretchRate: this.audioStretchRate,
          playbackRate: this.playbackRate,
          underruns: this.audioUnderruns,
          underrunFrames: this.audioUnderrunFrames,
          hardResyncs: this.audioHardResyncs,
          lastHardResyncReason: this.lastAudioHardResyncReason,
          lateSkips: this.audioLateSkips,
          catchUps: this.audioCatchUps,
          catchUpMs: this.audioCatchUpMs,
          primes: this.audioPrimes,
          streamRestarts: this.audioStreamRestarts,
          displayLagMs: this.displayLagMs,
          outputKind: this.audioOutputKind,
          outputFallbacks: this.audioOutputFallbacks,
          lastOutputFallbackReason: this.lastAudioOutputFallbackReason,
          alignmentDelayMs,
          sourceAlignmentDelayMs,
          requiredAlignmentDelayMs: this.requiredAlignmentDelayMs,
          audioRequiredAlignmentDelayMs: this.audioRequiredAlignmentDelayMs,
          videoRequiredAlignmentDelayMs: this.videoRequiredAlignmentDelayMs,
          sharedAlignmentRequests: this.sharedAlignmentRequests,
          lastAlignmentRequest: this.lastAlignmentRequest,
          synchronized: synchronizeEnabled,
          sharedPlaybackClock,
          actualPlaybackLatencyMs: playbackLatencyMs(),
          lastHeardAudioPtsUs: this.lastHeardAudioPtsUs,
          serverPullLeadMs,
          serverLatency: serverLatencyByPath.get(this.streamPath) || null,
          adaptiveLatentMs: this.adaptiveLatentMs,
          adaptiveLatentIncreases: this.adaptiveLatentIncreases,
          serverAlignmentTransfers: this.serverAlignmentTransfers,
          serverAlignmentTransferredMs: this.serverAlignmentTransferredMs,
          serverAlignmentStartupShifts: this.serverAlignmentStartupShifts,
          arrivalLeadMs: this.audioArrivalLeadMs,
          decodeLatencyMs: this.audioDecodeLatencyMs,
          decodeLatencyPeakMs: this.audioDecodeLatencyPeakMs,
          requiredLeadMs: this.requiredAudioLeadMs(),
          decodeTimestampOffsetMs: this.audioDecodeTimestampOffsetUs === null ? null : this.audioDecodeTimestampOffsetUs / 1000,
          decodeSubmitted: this.audioDecodeSubmitted,
          decodeOutputs: this.audioDecodeOutputs,
          decodeDroppedChunks: this.audioDecodeDroppedChunks,
          lastTagPtsUs: this.lastAudioTagPtsUs ?? null,
          lastDecodedPtsUs: this.lastAudioPtsUs,
          streamExpectedUs: this.audioStreamExpectedUs,
          streamBaseUs: this.audioStreamBaseUs,
          holesMs: this.audioHolesUs / 1000,
          overlapDrops: this.audioOverlapDrops,
          timestampJitterBlocks: this.audioTimestampJitterBlocks,
          pendingPcmMs: this.audioPendingPcmFrames / this.audioSampleRate() * 1000,
          decoderRecoveries: this.audioDecoderRecoveries,
          scheduleErrors: this.audioScheduleErrors,
          lastScheduleError: this.lastAudioScheduleError,
          stretcher: stretcher ? { ...stretcher.stats } : null,
        };
      }

      handleVideoTag(tag) {
        if (tag.data.length < 5 || (tag.data[0] & 0x0f) !== 7) return;
        const packetType = tag.data[1];
        if (packetType === 0) {
          this.configureVideo(tag.data.slice(5));
          return;
        }
        if (packetType !== 1 || tag.data.length <= 5) return;
        const compositionUs = signed24(tag.data, 2) * 1000;
        const timestampUs = tag.timestampUs + compositionUs;
        this.enqueueVideo(timestampUs, (tag.data[0] >> 4) === 1, tag.data.slice(5));
      }

      handleAudioTag(tag) {
        if (!tag.data.length || (tag.data[0] >> 4) !== 10 || tag.data.length < 2) return;
        const packetType = tag.data[1];
        if (packetType === 0) {
          try {
            const next = parseAudioConfig(tag.data.slice(2), Boolean(tag.data[0] & 1));
            if (next.key !== this.audioConfigKey) {
              // 新配置只替换 decoder；FIFO 里的声音继续播完，新格式的 PCM
              // 紧接其后，避免长流中编码器重配造成爆音。
              this.closeAudioDecoderInstance();
              this.audioConfig = next;
              this.audioConfigKey = next.key;
              this.configureAudio();
            }
          } catch (_) {
            this.audioConfig = null;
            refreshAudioUnlockVisibility();
          }
          return;
        }
        if (packetType !== 1 || !this.audioConfig || tag.data.length <= 2) return;
        const nowPerfMs = performance.now();
        const stallThresholdMs = this.audioDecoderStallThresholdMs();
        const activeWindowMs = Math.max(AUDIO_INPUT_ACTIVE_WINDOW_MS, stallThresholdMs * 3);
        if (this.lastAudioInputAt === 0 || nowPerfMs - this.lastAudioInputAt > activeWindowMs) {
          // 真正的源静音结束后给 decoder 一个完整输出窗口；连续输入期间不能
          // 重置该宽限期，否则“吞输入但不输出”的停滞会永远漏检。
          this.audioDecoderGraceUntil = nowPerfMs + stallThresholdMs;
        }
        this.lastAudioInputAt = nowPerfMs;
        this.lastAudioTagPtsUs = tag.timestampUs;
        this.observeAudioArrivalLead(tag.timestampUs, nowPerfMs);
        this.ensureAudioContextRunning(nowPerfMs);
        if (!this.audioDecoder) this.configureAudio();
        if (!this.audioDecoder) return;
        this.audioInput.push({ timestampUs: tag.timestampUs, data: tag.data.slice(2) });
        if (this.audioInput.length > MAX_AUDIO_INPUT) {
          this.audioInput = this.audioInput.slice(-MAX_AUDIO_INPUT);
        }
        this.pumpAudio();
        this.recoverStalledAudioDecoder(nowPerfMs);
      }

      handleTag(tag) {
        if (!tag || !tag.type) return;
