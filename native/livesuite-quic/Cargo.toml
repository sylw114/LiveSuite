[package]
name = "livesuite-quic-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
autobins = false

[lib]
name = "livesuite_quic_server"
crate-type = ["cdylib"]
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.11"
napi = { version = "2.16", default-features = false, features = ["napi8"] }
napi-derive = "2.16"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
rustls = { version = "0.23.37", default-features = false, features = ["std", "ring"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
